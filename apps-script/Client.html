<script>
let REPORT_DATA=null;
let TOKEN='', USER=null, DATA=null, PAGE='dashboard', DRIVER_TAB='km';
let PAGE_HISTORY=[];
let AUTO_REFRESH_TIMER=null;
const el=id=>document.getElementById(id);
function rpc(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e))))[name](...args));}
function setLoginMode(mode){
 document.getElementById('ownerForm').classList.toggle('hidden',mode!=='owner');
 document.getElementById('vehicleForm').classList.toggle('hidden',mode!=='vehicle');
 document.getElementById('ownerMode').classList.toggle('active',mode==='owner');
 document.getElementById('vehicleMode').classList.toggle('active',mode==='vehicle');
 document.getElementById('loginError').classList.add('hidden');
}
async function ownerLogin(e){e.preventDefault();await doLogin({username:document.getElementById('username').value,password:document.getElementById('password').value});}
async function vehicleLogin(e){e.preventDefault();await doLogin({vehiclePlate:document.getElementById('vehiclePlate').value,vehiclePin:document.getElementById('vehiclePin').value,driverName:document.getElementById('driverName').value});}
async function doLogin(payload){
 const err=document.getElementById('loginError');
 err.classList.add('hidden');
 try{
  const r=await rpc('login',payload);
  if(!r||!r.token||!r.user) throw new Error('Login response is incomplete. Please contact Fleet Admin.');
  TOKEN=r.token;
  USER=r.user;
  await openApp();
  sessionStorage.setItem('fleetToken',TOKEN);
 }catch(e){
  const message=e&&e.message?e.message:String(e);
  TOKEN=''; USER=null; DATA=null;
  try{sessionStorage.removeItem('fleetToken');}catch(storageError){}
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  err.textContent='Login succeeded, but the Fleet ERP screen could not load: '+message;
  err.classList.remove('hidden');
  console.error('Fleet ERP sign-in screen failed:',e);
 }
}
async function openApp(){
 const root=document.getElementById('mainContent');
 root.innerHTML='<div class="loading">Loading Fleet ERP data…</div>';
 try{
  await refreshData();
  document.getElementById('userLabel').textContent=(USER.role==='Driver'?(DATA.selectedDriverName||'Driver'):(USER.fullName||USER.username))+' · '+USER.role;
  renderNavigation();
  PAGE_HISTORY=[];
  showPage(USER.role==='Driver'?'fleet':'dashboard');
  startAutoRefresh();
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
 }catch(e){
  console.error('Fleet ERP data loading failed:',e);
  throw e;
 }
}
async function refreshData(){
 const result=await rpc('getAppData',TOKEN);
 if(!result||!Array.isArray(result.vehicles)) throw new Error('The server returned an invalid Fleet ERP data response.');
 DATA=result;
}
function showAppLoadError(message){
 const root=document.getElementById('mainContent');
 root.innerHTML='<div class="panel"><div class="alert error"><b>Fleet ERP could not load its data.</b><br>'+esc(message)+'</div><p>Please retry. If the problem continues, the server-side getAppData request needs investigation.</p><button class="btn primary" type="button" onclick="retryAppLoad()">Retry loading</button></div>';
}
async function retryAppLoad(){
 const root=document.getElementById('mainContent');
 root.innerHTML='<div class="loading">Retrying Fleet ERP data load…</div>';
 try{
  await refreshData();
  showPage(USER.role==='Driver'?'fleet':'dashboard');
 }catch(e){
  console.error('Fleet ERP retry failed:',e);
  showAppLoadError(e&&e.message?e.message:String(e));
 }
}
async function logout(){if(AUTO_REFRESH_TIMER){clearInterval(AUTO_REFRESH_TIMER);AUTO_REFRESH_TIMER=null;}PAGE_HISTORY=[];try{await rpc('logout',TOKEN);}catch(e){}TOKEN='';USER=null;DATA=null;sessionStorage.removeItem('fleetToken');document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');}
function renderNavigation(){
 const driverPages=['fleet','handovers','troubleshooter'];
 document.querySelectorAll('.nav-btn').forEach(b=>{b.style.display=USER.role!=='Driver'||driverPages.includes(b.dataset.page)?'block':'none';});
 document.querySelectorAll('[data-nav-group]').forEach(g=>{g.style.display=[...g.querySelectorAll('.nav-btn')].some(b=>b.style.display!=='none')?'block':'none';});
}
function showPage(page, fromBack){
 if(!fromBack && PAGE && page!==PAGE) PAGE_HISTORY.push(PAGE);
 if(USER?.role==='Driver'&&['fleet','km','maintenance','tickets','tires','tire-survey'].includes(page)){
  DRIVER_TAB=page==='fleet'?'km':(page==='tickets'?'maintenance':page);
  page='fleet';
 }
 const allowed=['fleet','handovers','troubleshooter','km','maintenance','tickets','tires','tire-survey'];
 if(USER.role==='Driver'&&!allowed.includes(page))page='fleet';
 if(USER.role==='Driver'&&!DATA?.selectedDriverName&&page!=='fleet')page='fleet';
 PAGE=page;
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='audit'){loadAuditPage();return;}
 if(page==='reports'){loadFleetReports();return;}
 render();
}
function goBackPage(){
 while(PAGE_HISTORY.length){const previous=PAGE_HISTORY.pop();if(previous!==PAGE){showPage(previous,true);return;}}
 showPage(USER&&USER.role==='Driver'?'fleet':'dashboard',true);
}
function startAutoRefresh(){
 if(AUTO_REFRESH_TIMER)clearInterval(AUTO_REFRESH_TIMER);
 AUTO_REFRESH_TIMER=setInterval(async()=>{
  if(!TOKEN||!USER||document.hidden)return;
  const active=document.activeElement;
  if(active&&(/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)||active.isContentEditable))return;
  try{await refreshData();if(PAGE==='reports'){await loadFleetReports();return;}if(PAGE==='audit'){await loadAuditPage();return;}render();}
  catch(e){console.warn('Automatic Fleet ERP refresh failed:',e);}
 },60000);
}
function toggleTheme(){
 const dark=document.body.classList.toggle('dark-mode');
 const b=document.getElementById('themeToggle');
 if(b)b.textContent=dark?'☀️':'🌙';
 try{sessionStorage.setItem('fleetTheme',dark?'dark':'light');}catch(e){}
}
function render(){
 const root=document.getElementById('mainContent');
 if(!DATA){root.innerHTML='<div class="loading">Loading…</div>';return;}
 const vehicles=DATA.vehicles||[],tickets=DATA.tickets||[],km=DATA.km||[];
 const overdue=vehicles.filter(v=>v.oilStatus==='Urgent Overdue').length,warning=vehicles.filter(v=>v.oilStatus==='Warning').length;
 if(PAGE==='fleet'&&USER.role==='Driver')root.innerHTML=driverPortalHtml(vehicles);
 else if(PAGE==='dashboard'||PAGE==='gm')root.innerHTML=dashboardHtml(vehicles,tickets,km,overdue,warning);
 else if(PAGE==='vehicles')root.innerHTML=vehiclesHtml(vehicles);
 else if(PAGE==='km')root.innerHTML=USER.role==='Driver'?driverKmHtml(vehicles):kmHtml(vehicles);
 else if(PAGE==='oil')root.innerHTML=oilHtml(vehicles);
 else if(PAGE==='tickets')root.innerHTML=ticketsHtml(tickets);
 else if(PAGE==='maintenance')root.innerHTML=sixMonthMaintenanceHtml(DATA.maintenance||[],vehicles);
 else if(PAGE==='tires')root.innerHTML=tiresHtml(DATA.tireRequests||[],vehicles);
 else if(PAGE==='tire-survey')root.innerHTML=tireSurveyHtml(vehicles);
 else if(PAGE==='inspections')root.innerHTML=inspectionsHtml(DATA.inspections||[],vehicles);
 else if(PAGE==='reports')root.innerHTML=fleetReportsHtml(REPORT_DATA);
  else if(PAGE==='handovers')root.innerHTML=handoversHtml(DATA.handovers||[],vehicles);
 else root.innerHTML=placeholderHtml(PAGE);
 const toolbar='<div class="page-title global-page-tools"><div><small class="muted">Auto refresh every 60 seconds</small></div><div class="form-actions"><button class="btn secondary" type="button" onclick="goBackPage()">← Go Back</button><button class="btn secondary" type="button" onclick="refreshAndRender()">↻ Refresh Now</button></div></div>';
 root.innerHTML=toolbar+root.innerHTML;
}function dashboardHtml(v,t,k,overdue,warning){
 const openTires=(DATA.tireRequests||[]).filter(x=>!['Completed','Rejected','Closed'].includes(String(x.status)));
 const pendingInspections=(DATA.inspections||[]).filter(x=>String(x.status)!=='Completed');
 const pendingMaintenance=(DATA.maintenance||[]).filter(x=>String(x.status)!=='Completed');
 return '<div class="page-title"><div><h2>🚗 Vehicle Control Center</h2><p>Live fleet overview, pending actions and daily vehicle controls.</p></div><button class="btn primary" onclick="refreshAndRender()">↻ Refresh</button></div>'+
 '<div class="cards-grid">'+card('Total Vehicles',v.length,'Registered fleet')+card('Oil Overdue',overdue,'Immediate attention','urgent')+card('Oil Warning',warning,'Approaching due','warning')+card('Open Tickets',t.filter(x=>x.status!=='Closed').length,'Maintenance and issues','warning')+card('Open Tire Requests',openTires.length,'Awaiting follow-up','warning')+card('Pending Inspections',pendingInspections.length,'Compliance follow-up','warning')+card('Pending Maintenance',pendingMaintenance.length,'Scheduled / in progress')+card('KM Entries',k.length,'Recorded readings')+'</div>'+
 '<div class="panel"><h3>Vehicle Status</h3>'+vehicleTable(v)+'</div>';
}
function card(label,value,note,tone){return '<div class="card"><h3>'+esc(label)+'</h3><div class="big-number">'+Number(value||0).toLocaleString()+'</div><div class="sub">'+esc(note)+'</div></div>';}
function vehicleTable(rows){if(!rows.length)return '<div class="empty">No vehicle records yet. Vehicle data will be loaded from the real backup in the migration phase.</div>';
 return '<div class="table-wrap"><table><thead><tr><th>Plate</th><th>Make / Model</th><th>Site</th><th>Driver</th><th>Current KM</th><th>Oil Remaining</th><th>Status</th></tr></thead><tbody>'+rows.map(v=>'<tr><td><b>'+esc(v.plate)+'</b></td><td>'+esc((v.make||'')+' '+(v.model||''))+'</td><td>'+esc(v.site||'-')+'</td><td>'+esc(v.assigned_driver||'-')+'</td><td>'+fmt(v.current_km)+'</td><td>'+fmt(v.remaining)+' km</td><td>'+status(v.status)+'</td></tr>').join('')+'</tbody></table></div>';
}
function vehiclesHtml(v){
 const admin=USER.role==='Owner';
 return '<div class="page-title"><div><h2>🚙 Vehicle Master</h2><p>Vehicle identity, driver assignment and current status.</p></div>'+(admin?'<button class="btn primary" onclick="toggleVehicleForm()">+ Add Vehicle</button>':'')+'</div>'+
 '<div id="vehicleFormWrap" class="panel hidden"><h3>Add Vehicle</h3><form onsubmit="addVehicleForm(event)"><div class="form-row"><div><label>Plate</label><input id="newPlate" required></div><div><label>Make</label><input id="newMake"></div><div><label>Model</label><input id="newModel"></div><div><label>Year</label><input id="newYear"></div><div><label>Site</label><input id="newSite"></div><div><label>Assigned Driver</label><input id="newDriver"></div><div><label>Driver Phone</label><input id="newPhone"></div><div><label>Current KM</label><input id="newKm" type="number" min="0" value="0"></div><div><label>Last Oil KM</label><input id="newOilKm" type="number" min="0" value="0"></div><div><label>Oil Interval KM</label><input id="newInterval" type="number" min="1000" value="5000"></div><div><label>Vehicle Access Code (optional)</label><input id="newPin" type="password" minlength="4" placeholder="Not required for shared Driver Portal"></div></div><div class="form-actions"><button class="btn primary">Save Vehicle</button><button type="button" class="btn secondary" onclick="toggleVehicleForm()">Cancel</button></div></form></div>'+
 '<div class="panel">'+vehicleTable(v)+'</div>';
}
function toggleVehicleForm(){document.getElementById('vehicleFormWrap').classList.toggle('hidden');}
async function addVehicleForm(e){e.preventDefault();try{await rpc('addVehicle',TOKEN,{plate:el('newPlate').value,make:el('newMake').value,model:el('newModel').value,year:el('newYear').value,site:el('newSite').value,driver:el('newDriver').value,phone:el('newPhone').value,currentKm:el('newKm').value,lastOilKm:el('newOilKm').value,oilIntervalKm:el('newInterval').value,vehiclePin:el('newPin').value});alert('Vehicle added. Give its access code only to its assigned drivers.');await refreshData();render();}catch(err){alert(err.message);}}
function kmHtml(v){
 if(USER.role==='Driver') return driverKmHtml(v);
 const vehicles=(v||[]).filter(x=>String(x.status||'Active').trim().toLowerCase()!=='inactive');
 const riyadhDateKey=value=>{
  if(value===null||value===undefined||value==='')return '';
  if(value instanceof Date){
   if(Number.isNaN(value.getTime()))return '';
   const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(value);
   const part=type=>parts.find(p=>p.type===type)?.value||'';
   return part('year')+'-'+part('month')+'-'+part('day');
  }
  const raw=String(value).trim();
  const localMatch=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(localMatch){
   const day=localMatch[1].padStart(2,'0'),month=localMatch[2].padStart(2,'0'),year=localMatch[3];
   return year+'-'+month+'-'+day;
  }
  const parsed=new Date(raw);
  if(Number.isNaN(parsed.getTime()))return '';
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(parsed);
  const part=type=>parts.find(p=>p.type===type)?.value||'';
  return part('year')+'-'+part('month')+'-'+part('day');
 };
 const kmTimestamp=value=>{
  if(value===null||value===undefined||value==='')return 0;
  if(value instanceof Date)return Number.isNaN(value.getTime())?0:value.getTime();
  const raw=String(value).trim();
  const localMatch=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(localMatch)return Date.UTC(Number(localMatch[3]),Number(localMatch[2])-1,Number(localMatch[1]),Number(localMatch[4]||0),Number(localMatch[5]||0),Number(localMatch[6]||0));
  const parsed=new Date(raw);
  return Number.isNaN(parsed.getTime())?0:parsed.getTime();
 };
 const today=riyadhDateKey(DATA.serverTime||new Date());
 const todays=(DATA.km||[]).filter(r=>riyadhDateKey(r.reading_date)===today);
 const latestByVehicle={};
 todays.forEach(r=>{
  const id=String(r.vehicle_id);
  if(!latestByVehicle[id]||kmTimestamp(r.created_at||r.reading_date)>kmTimestamp(latestByVehicle[id].created_at||latestByVehicle[id].reading_date))latestByVehicle[id]=r;
 });
 const entered=vehicles.filter(v=>latestByVehicle[String(v.vehicle_id)]).length;
 const missing=vehicles.length-entered;
 const options=vehicles.map(x=>'<option value="'+esc(x.vehicle_id)+'">'+esc(x.plate)+'</option>').join('');
 const rows=vehicles.map(vehicle=>{
  const record=latestByVehicle[String(vehicle.vehicle_id)];
  const driver=vehicle.assigned_driver||record?.driver_name||'Not assigned';
  const phone=normalizeWhatsAppPhone(vehicle.driver_phone);
  const reminder=(!record&&phone)?'<button type="button" class="btn secondary small" onclick="remindKmVehicle(\''+esc(vehicle.vehicle_id)+'\')">WhatsApp Reminder</button>':(!record?'<span class="muted">No phone saved</span>':'—');
  return '<tr><td><b>'+esc(vehicle.plate||vehicle.vehicle_id)+'</b><div class="muted">'+esc(vehicle.vehicle_id)+'</div></td><td>'+esc(driver)+'</td><td>'+(record?'<span class="badge safe">Entered</span>':'<span class="badge urgent">Not Entered</span>')+'</td><td>'+(record?fmt(record.reading_km)+' km':'—')+'</td><td>'+(record?esc(record.created_at||record.reading_date):'—')+'</td><td>'+reminder+'</td></tr>';
 }).join('');
 return '<div class="page-title"><div><h2>📏 Daily KM Control</h2><p>Record odometer readings and track which drivers have submitted today.</p></div></div>'+
 '<div class="stats-grid"><div class="stat-card"><span>Total Active Vehicles</span><strong>'+vehicles.length+'</strong></div><div class="stat-card"><span>KM Entered Today</span><strong>'+entered+'</strong></div><div class="stat-card"><span>Not Entered Today</span><strong>'+missing+'</strong></div><div class="stat-card"><span>Submission Rate</span><strong>'+(vehicles.length?Math.round(entered/vehicles.length*100):0)+'%</strong></div></div>'+
 '<div class="panel"><h3>Record Daily KM</h3><form onsubmit="saveKm(event)"><div class="form-row"><div><label>Vehicle</label><select id="kmVehicle" required>'+options+'</select></div><div><label>Current Odometer (KM)</label><input id="kmReading" type="number" min="0" required></div><div><label>Driver Name</label><input id="kmDriver" value="'+esc(USER.fullName||'')+'" required></div></div><label>Notes</label><textarea id="kmNotes"></textarea><div class="form-actions"><button class="btn success-btn">Save KM Reading</button></div></form></div>'+
 '<div class="panel"><div class="page-title"><div><h3>Today’s KM Submission Status</h3><p class="muted">As of '+esc(today)+' — each active vehicle is counted once.</p></div></div><div class="table-wrap"><table><thead><tr><th>Vehicle</th><th>Assigned Driver</th><th>Today Status</th><th>Odometer</th><th>Submitted At</th><th>Follow-up</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6">No active vehicles found.</td></tr>')+'</tbody></table></div></div>'+
 '<div class="panel"><h3>Recent KM Records</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Vehicle</th><th>Reading</th><th>Driver</th></tr></thead><tbody>'+(DATA.km||[]).slice().reverse().slice(0,30).map(r=>'<tr><td>'+esc(r.reading_date)+'</td><td>'+esc(vehiclePlate(r.vehicle_id))+'</td><td>'+fmt(r.reading_km)+'</td><td>'+esc(r.driver_name)+'</td></tr>').join('')+'</tbody></table></div></div>';
}
async function remindKmVehicle(vehicleId){
 const popup=window.open('about:blank','_blank');
 if(!popup){alert('Please allow pop-ups to open WhatsApp.');return;}
 try{
  await refreshData();
  const vehicle=(DATA.vehicles||[]).find(x=>String(x.vehicle_id)===String(vehicleId));
  if(!vehicle){popup.close();alert('Vehicle data could not be refreshed.');return;}
  const phone=normalizeWhatsAppPhone(vehicle.driver_phone);
  if(!phone){popup.close();alert('No WhatsApp number is saved for this vehicle’s assigned driver.');return;}
  const driver=vehicle.assigned_driver||'Driver';
  const nl=String.fromCharCode(10);
  const message=['Hello '+driver+',','','No daily odometer reading has been recorded today for vehicle '+(vehicle.plate||vehicle.vehicle_id)+'.','Last recorded KM: '+Number(vehicle.current_km||0).toLocaleString()+' km.','','Please submit today’s current odometer reading.','','Thank you,','Fleet Management'].join(nl);
  popup.location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(message);
 }catch(err){try{popup.close();}catch(e){}alert('Unable to prepare WhatsApp reminder: '+(err.message||String(err)));}
}
function driverPortalHtml(v){
 const selected=DATA.selectedDriverName||'';
 const tabs=[
  {id:'km',icon:'📏',label:'Add Daily KM'},
  {id:'maintenance',icon:'🛠️',label:'Maintenance Issue Report'},
  {id:'tires',icon:'🛞',label:'Tire Service Request'},
  {id:'tire-survey',icon:'🛞',label:'Tire Survey'}
 ];
 const tabBar='<div class="driver-tabs" role="tablist">'+tabs.map(t=>'<button type="button" role="tab" aria-selected="'+(DRIVER_TAB===t.id?'true':'false')+'" class="driver-tab '+(DRIVER_TAB===t.id?'active':'')+'" onclick="selectPortalAction(\''+t.id+'\')"><span>'+t.icon+'</span><b>'+t.label+'</b></button>').join('')+'</div>';
 if(!selected){
  const choices=(DATA.vehicleChoices||[]).map(x=>'<option value="'+esc(x.vehicle_id)+'">'+esc(x.plate||x.vehicle_id)+' - '+esc(x.assigned_driver||'Driver not assigned')+'</option>').join('');
  return '<div class="page-title"><div><h2>🚗 Fleet</h2><p>Fleet vehicle and maintenance actions.</p></div></div>'+
   tabBar+'<div class="panel driver-select-panel"><h3>Driver Portal</h3><label for="portalVehicle">Select Vehicle</label><select id="portalVehicle" onchange="choosePortalVehicle()"><option value="">-- Choose your vehicle --</option>'+choices+'</select><p class="muted">Please select your assigned vehicle to continue.</p></div>';
 }
 if(!v.length)return '<div class="alert warning">No active vehicles are assigned to '+esc(selected)+'. Please contact Fleet Admin.</div>';
 const vehicle=v[0];
 const options=v.map(x=>'<option value="'+esc(x.vehicle_id)+'" '+(String(x.vehicle_id)===String(vehicle.vehicle_id)?'selected':'')+'>'+esc(x.plate)+' - '+esc(x.assigned_driver||selected)+'</option>').join('');
 const vehiclePanel='<div class="panel driver-vehicle-panel"><div class="driver-vehicle-heading"><div><h3>Driver Portal</h3><p class="muted">Your assigned vehicle details</p></div><div class="driver-vehicle-select"><label for="kmVehicle">Select Vehicle</label><select id="kmVehicle" onchange="renderDriverKmSummary()">'+options+'</select></div></div><div id="driverKmSummary">'+driverVehicleSummary(vehicle)+'</div></div>';
 let content='';
 if(DRIVER_TAB==='km'){
  const recent=(DATA.km||[]).filter(r=>String(r.vehicle_id)===String(vehicle.vehicle_id)).slice().reverse().slice(0,15);
  content='<div class="page-title driver-section-title"><div><h2>📏 Add Daily KM</h2><p>Record today’s odometer reading for your assigned vehicle.</p></div></div>'+
   '<div class="panel driver-form-panel"><form onsubmit="saveDriverKm(event)"><label for="kmReading">Today’s Odometer Reading (km) *</label><input id="kmReading" type="number" min="0" placeholder="Enter current odometer reading" required>'+
   '<label for="kmNotes">Notes</label><textarea id="kmNotes" placeholder="Optional notes"></textarea>'+
   '<div class="form-actions"><button class="btn primary" type="submit">Save Daily KM</button><button class="btn secondary" type="button" onclick="driverOilChanged()">🔧 Record Oil Change</button></div></form></div>'+
   '<div class="panel"><h3>My Recent KM Records</h3>'+ticketKmTable(recent)+'</div>';
 }else if(DRIVER_TAB==='maintenance'){
  content='<div class="driver-ticket-form">'+ticketsHtml(DATA.tickets||[])+'</div>';
 }else if(DRIVER_TAB==='tires'){
  content=tiresHtml(DATA.tireRequests||[],v);
 }else if(DRIVER_TAB==='tire-survey'){
  content=tireSurveyHtml(v);
 }
 return '<div class="page-title"><div><h2>🚗 Fleet</h2><p>Fleet vehicle and maintenance actions.</p></div></div>'+tabBar+vehiclePanel+content;
}
async function choosePortalVehicle(){
 const id=el('portalVehicle')?.value;
 if(!id){alert('Please select your vehicle number first.');return;}
 try{
  const result=await rpc('selectPortalVehicleAndGetAppData',TOKEN,id);
  if(!result||!Array.isArray(result.vehicles))throw new Error('The server returned an invalid Fleet ERP data response.');
  DATA=result;
  USER=result.user;
  document.getElementById('userLabel').textContent=(result.selectedDriverName||'Driver')+' · Driver';
  renderNavigation();
  showPage('fleet');
 }catch(err){alert(err.message||String(err));}
}
function selectPortalAction(page){
 if(!USER?.vehicleId){alert('Please select your vehicle number first.');return;}
 DRIVER_TAB=page==='tickets'?'maintenance':page;
 PAGE='fleet';
 render();
}

function driverKmHtml(v){
 const options=v.map(x=>'<option value="'+esc(x.vehicle_id)+'">'+esc(x.plate)+'</option>').join('');
 const recent=(DATA.km||[]).slice().reverse().slice(0,15);
 return '<div class="page-title"><div><h2>📏 Add Daily KM</h2><p>Record today’s odometer reading for your assigned vehicle.</p></div></div>'+
 '<div class="panel"><form onsubmit="saveDriverKm(event)"><div class="form-row"><div><label>Vehicle *</label><select id="kmVehicle" required onchange="renderDriverKmSummary()">'+options+'</select></div>'+
 '<div><label>Today’s Odometer Reading (km) *</label><input id="kmReading" type="number" min="0" required></div></div>'+
 '<div id="driverKmSummary">'+driverVehicleSummary(v[0])+'</div><label>Notes</label><textarea id="kmNotes" placeholder="Optional notes"></textarea>'+
 '<div class="form-actions"><button class="btn primary" type="submit">Save Daily KM</button><button class="btn secondary" type="button" onclick="driverOilChanged()">🔧 Record Oil Change</button></div></form></div>'+

async function imageToJpegDataUrl(file){
 if(!file) throw new Error('Attach all six tire photos.');
 const source=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});
 const img=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=source;});
 const scale=Math.min(1,1400/Math.max(img.width,img.height));
 const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
 canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
 return canvas.toDataURL('image/jpeg',0.78);
}

async function addTireStockForm(e){
 e.preventDefault();
 try{
  const quantity=Number(el('stockQuantity').value),serialMode=el('stockSerialMode').value;
  const serials=serialMode==='manufacturer'?el('stockSerials').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean):[];
  if(!Number.isInteger(quantity)||quantity<1||quantity>100)throw new Error('Quantity must be between 1 and 100.');
  if(serialMode==='manufacturer'&&serials.length!==quantity)throw new Error('Enter exactly '+quantity+' unique manufacturer serial numbers.');
  if(serialMode==='manufacturer'&&new Set(serials.map(x=>x.toLowerCase())).size!==serials.length)throw new Error('Duplicate serial numbers are not allowed.');
  await rpc('addTireStock',TOKEN,{quantity,serialMode,manufacturerSerials:serials,brand:el('stockBrand').value,model:el('stockModel').value,size:el('stockSize').value,warehouse:el('stockWarehouse').value,receivedDate:el('stockReceived').value,purchaseCost:el('stockCost').value,notes:el('stockNotes').value});
  alert(serialMode==='internal'?'Existing tires received. Unique internal tracking numbers were generated for each tire.':'Tires received into inventory.');
  await refreshData();render();
 }catch(err){alert(err.message||String(err));}
}
async function transferTireStockForm(e){

  if(new Set(serials.map(x=>x.toLowerCase())).size!==serials.length)throw new Error('Duplicate serial numbers are not allowed.');
  const sourceSite=el('transferSource').value,destinationSite=el('transferDestination').value.trim();

async function sendSixMonthDueReminder(recordId){
 const r=(DATA.maintenance||[]).find(x=>String(x.record_id)===String(recordId));
 if(!r||/^completed$/i.test(String(r.status||'').trim())){alert('This scheduled maintenance record is unavailable or already completed.');return;}
 const popup=window.open('about:blank','_blank');if(!popup){alert('Please allow pop-ups to open WhatsApp.');return;}
 try{
  const vehicle=(DATA.vehicles||[]).find(x=>String(x.vehicle_id)===String(r.vehicle_id))||{};
  const phone=normalizeWhatsAppPhone(vehicle.driver_phone);
  if(!phone){popup.close();alert('No WhatsApp number is saved for this vehicle’s assigned driver.');return;}
  const driver=r.technician||vehicle.assigned_driver||'Driver',plate=vehicle.plate||r.vehicle_id,nl=String.fromCharCode(10);
  const due=new Date(String(r.scheduled_date||'').slice(0,10)+'T12:00:00').toLocaleDateString('en-GB');
  const message=['Hello '+driver+',','','The 6-month maintenance for vehicle '+plate+' is approaching.','Scheduled due date: '+due+'.','','Please arrange the maintenance and confirm once the work has been completed.','','Fleet Management'].join(nl);
  popup.location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(message);
 }catch(e){try{popup.close();}catch(x){}alert(e.message||String(e));}
}

function startIssueSpeech(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  alert('Voice input is not supported by this browser. Please use Google Chrome.');
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang='en-US';
 recognition.continuous=true;
 recognition.interimResults=false;
 recognition.onresult=function(event){
  let spoken='';
  for(let i=event.resultIndex;i<event.results.length;i++){
   spoken+=event.results[i][0].transcript+' ';
  }
  const field=el('ticketDescription');
  field.value=(field.value+' '+spoken).trim();
 };
 recognition.onerror=function(event){alert('Voice recognition error: '+event.error);};
 recognition.start();
}

function normalizeWhatsAppPhone(value){
 let phone=String(value||'').replace(/\D/g,'');
 if(phone.startsWith('00'))phone=phone.slice(2);
 if(phone.startsWith('966'))return phone;
 if(phone.length===10&&phone.startsWith('05'))return '966'+phone.slice(1);
 if(phone.length===9&&phone.startsWith('5'))return '966'+phone;
 return phone;
}
function vehiclePlate(id){const v=(DATA.vehicles||[]).find(x=>String(x.vehicle_id)===String(id));return v?v.plate:id;}
function fmt(n){return Number(n||0).toLocaleString();}
function status(s){const c=s==='Safe'||s==='Closed'?'safe':s==='Warning'?'warning':'urgent';return '<span class="badge '+c+'">'+esc(s||'Open')+'</span>';}
function priorityBadge(p){const value=String(p||'Medium');const c=value==='Low'?'safe':value==='Medium'?'info':value==='High'?'warning':'urgent';return '<span class="badge '+c+'">'+esc(value)+'</span>';}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
