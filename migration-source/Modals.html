<!-- ================= WORK ORDER MODAL ================= -->
<div class="modal fade" id="woModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">🛠️ New Work Order</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label">Site *</label>
            <input type="text" class="form-control" id="woSite">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Area</label>
            <input type="text" class="form-control" id="woArea">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="woCategory">
              <option value="Electrical">Electrical</option>
              <option value="Mechanical">Mechanical</option>
              <option value="Civil">Civil</option>
              <option value="HVAC">HVAC</option>
              <option value="Plumbing">Plumbing</option>
              <option value="General">General</option>
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Priority</label>
            <select class="form-select" id="woPriority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
              <option value="Critical">Critical</option>
            </select>
          </div>

          <div class="col-12 mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" id="woDescription"></textarea>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Assigned To</label>
            <input type="text" class="form-control" id="woAssignedTo">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Contractor</label>
            <input type="text" class="form-control" id="woContractor">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" id="woDate">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Image</label>
            <input type="file" class="form-control" id="woImage" accept="image/*">
          </div>

        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" onclick="saveWorkOrderForm()">➕ Add Work Order</button>
      </div>

    </div>
  </div>
</div>

<!-- ================= DEVELOPMENT PROJECT MODAL ================= -->
<div class="modal fade" id="devProjectModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">

      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">📁 New Development Project</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="row">

          <div class="col-md-6 mb-3">
            <label>Project Name</label>
            <input class="form-control" id="devProjectName">
          </div>

          <div class="col-md-6 mb-3">
            <label>Site</label>
            <input class="form-control" id="devProjectSite">
          </div>

          <div class="col-12 mb-3">
            <label>Description</label>
            <textarea class="form-control" rows="3" id="devProjectDesc"></textarea>
          </div>

          <div class="col-md-6 mb-3">
            <label>Contractor</label>
            <input class="form-control" id="devProjectContractor">
          </div>

          <div class="col-md-6 mb-3">
            <label>Total Cost</label>
            <input type="number" class="form-control" id="devProjectBudget" placeholder="0">
          </div>

          <div class="col-md-6 mb-3">
            <label>Status</label>
            <select class="form-select" id="devProjectStatus">
              <option value="Planned">Planned</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>

          <div class="col-md-3 mb-3">
            <label>Start Date</label>
            <input type="date" class="form-control" id="devProjectStartDate">
          </div>

          <div class="col-md-3 mb-3">
            <label>End Date</label>
            <input type="date" class="form-control" id="devProjectEndDate">
          </div>

          <div class="col-12 mb-3">
            <label>🖼️ Image</label>
            <input type="file" class="form-control" id="devProjectImage" accept="image/*">
          </div>

        </div>

        <div id="devProjectMessage"></div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" onclick="saveDevProjectForm()">➕ Add Project</button>
      </div>

    </div>
  </div>
</div>

<!-- ================= SITE MODAL ================= -->
<div class="modal fade" id="siteModal" tabindex="-1">

    <div class="modal-content">

      <div class="modal-header bg-warning">

        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" onclick="saveSiteForm()">➕ Add Site</button>

    </div>
  </div>
</div>

<!-- ================= SITE TASK MODAL ================= -->
<div class="modal fade" id="siteTaskModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header bg-info text-white">
        <h5 class="modal-title">🏗️ New Site Task</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label">🏢 Site</label>
          <select class="form-select" id="siteTaskSite">
            <option value="">-- Select Site --</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">📝 Task Description</label>
          <textarea class="form-control" rows="3" id="siteTaskDesc" placeholder="Describe the task..."></textarea>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">📅 Start Date</label>
              <input type="date" class="form-control" id="siteTaskStartDate">
            </div>
          </div>
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">👤 Assigned To</label>
              <input type="text" class="form-control" id="siteTaskAssigned" placeholder="Person name">
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">🖼️ Image</label>
          <input type="file" class="form-control" id="siteTaskImage" accept="image/*">
        </div>

        <div class="mb-3">
          <label class="form-label">📝 Notes</label>
          <textarea class="form-control" rows="2" id="siteTaskMessage" placeholder="Additional notes..."></textarea>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">❌ Cancel</button>
        <button class="btn btn-success" onclick="saveSiteTaskForm()">➕ Add Task</button>
      </div>

    </div>
  </div>
</div>

<!-- ================= PURCHASE MODAL ================= -->
<div class="modal fade" id="purchaseModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header bg-info text-white">
        <h5 class="modal-title">📦 Add Purchase / Spare Part</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label>Type</label>
          <select class="form-select" id="purchaseType">
            <option value="Work Order">Work Order</option>
            <option value="Development Project">Development Project</option>
            <option value="General">General</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Reference ID</label>
          <input class="form-control" id="purchaseReference">
        </div>

        <div class="mb-3">
          <label>Item Name</label>
          <input class="form-control" id="purchaseItem">
        </div>

        <div class="row">
          <div class="col-md-6">
            <label>Quantity</label>
            <input type="number" class="form-control" id="purchaseQty">
          </div>
          <div class="col-md-6">
            <label>Unit Cost</label>
            <input type="number" class="form-control" id="purchaseCost">
          </div>
        </div>

        <div class="mb-3 mt-3">
          <label>Supplier</label>
          <input class="form-control" id="purchaseSupplier">
        </div>

        <!-- ✅ حقل جديد: من اشترى؟ -->
        <div class="mb-3">
          <label>Purchased By</label>
          <select class="form-select" id="purchaseBy">
            <option value="Company">🏢 Company</option>
            <option value="Contractor">👷 Contractor</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Purchase Date</label>
          <input type="date" class="form-control" id="purchaseDate">
        </div>

        <div class="mb-3">
          <label>Notes</label>
          <textarea class="form-control" id="purchaseNotes"></textarea>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" onclick="savePurchaseForm()">➕ Save Purchase</button>
      </div>

    </div>
  </div>
</div>
