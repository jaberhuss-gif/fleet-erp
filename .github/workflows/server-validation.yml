name: Fleet ERP server validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Check server JavaScript syntax
        run: |
          node --check server.js
          node --check building-maintenance-requests.js
