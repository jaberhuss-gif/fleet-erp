<script>
let TOKEN='', USER=null, DATA=null, PAGE='dashboard';
const el=id=>document.getElementById(id);
function rpc(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e))))[name](...args));}
function setLoginMode(mode){
 document.getElementById('ownerForm').classList.toggle('hidden',mode!=='owner');
 document.getElementById('vehicleForm').classList.toggle('hidden',mode!=='vehicle');
 document.getElementById('ownerMode').classList.toggle('active',mode==='owner');
 document.getElementById('vehicleMode').classList.toggle('active',mode==='vehicle');
 document.getElementById('loginError').classList.add('hidden');
}
async function ownerLogin(e){e.preventDefault();await doLogin({username:document.getElementById('username').value,password:document.getElementById('password').value});}
async function vehicleLogin(e){e.preventDefault();await doLogin({vehiclePlate:document.getElementById('vehiclePlate').value,vehiclePin:document.getElementById('vehiclePin').value,driverName:document.getElementById('driverName').value});}
async function doLogin(payload){
 const err=document.getElementById('loginError');err.classList.add('hidden');
 try{const r=await rpc('login',payload);TOKEN=r.token;USER=r.user;sessionStorage.setItem('fleetToken',TOKEN);await openApp();}
 catch(e){err.textContent=e.message;err.classList.remove('hidden');}
}
async async function openApp(){
 document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');
 document.getElementById('userLabel').textContent=(USER.role==='Driver'?(DATA?.selectedDriverName||'Shared Driver Portal'):(USER.fullName||USER.username))+' · '+USER.role;
 renderNavigation();
 await refreshData();showPage(USER.role==='Driver'?'km':'dashboard');
}
async function refreshData(){DATA=await rpc('getAppData',TOKEN);}
async function logout(){try{await rpc('logout',TOKEN);}catch(e){}TOKEN='';USER=null;DATA=null;sessionStorage.removeItem('fleetToken');document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');}
function renderNavigation(){
 const driverPages=['km','maintenance','tickets','tires'];
 document.querySelectorAll('.nav-btn').forEach(b=>{
   const page=b.dataset.page;
   const visible=USER.role!=='Driver'||driverPages.includes(page);
   b.style.display=visible?'block':'none';
 });
 document.querySelectorAll('[data-nav-group]').forEach(g=>{
   const visible=[...g.querySelectorAll('.nav-btn')].some(b=>b.style.display!=='none');
   g.style.display=visible?'block':'none';
 });
}
function showPage(page){
 const driverPages=['km','maintenance','tickets','tires'];
 if(USER.role==='Driver'&&!driverPages.includes(page)) page='km';
 PAGE=page;
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='audit'){loadAuditPage();return;}
 render();
}
function toggleTheme(){
 const dark=document.body.classList.toggle('dark-mode');
 const b=document.getElementById('themeToggle');
 if(b)b.textContent=dark?'☀️':'🌙';
 try{sessionStorage.setItem('fleetTheme',dark?'dark':'light');}catch(e){}
}
function render(){
 const root=document.getElementById('mainContent');
 if(!DATA){root.innerHTML='<div class="loading">Loading…</div>';return;}
 const vehicles=DATA.vehicles||[],tickets=DATA.tickets||[],km=DATA.km||[],maint=DATA.maintenance||[];
 const total=vehicles.length,overdue=vehicles.filter(v=>v.status==='Urgent Overdue').length,warning=vehicles.filter(v=>v.status==='Warning').length;
 if(PAGE==='dashboard'||PAGE==='gm')root.innerHTML=dashboardHtml(vehicles,tickets,km,overdue,warning);
 else if(PAGE==='vehicles')root.innerHTML=vehiclesHtml(vehicles);
 else if(PAGE==='km')root.innerHTML=kmHtml(vehicles);
 else if(PAGE==='oil')root.innerHTML=oilHtml(vehicles);
 else if(PAGE==='tickets'||PAGE==='maintenance')root.innerHTML=ticketsHtml(tickets);
 else if(PAGE==='tires')root.innerHTML=tiresHtml(DATA.tireRequests||[],vehicles);
 else if(PAGE==='inspections')root.innerHTML=inspectionsHtml(DATA.inspections||[],vehicles);
 else root.innerHTML=placeholderHtml(PAGE);
}
function dashboardHtml(v,t,k,overdue,warning){
 return '<div class="page-title"><div><h2>🚗 Vehicle Control Center</h2><p>Fleet overview and daily vehicle controls.</p></div><button class="btn primary" onclick="refreshAndRender()">↻ Refresh</button></div>'+
 '<div class="cards-grid">'+card('Total Vehicles',v.length,'Registered fleet')+card('Oil Overdue',overdue,'Immediate attention','urgent')+card('Oil Warning',warning,'Approaching due','warning')+card('Open Tickets',t.filter(x=>x.status!=='Closed').length,'Maintenance and issues')+card('KM Entries',k.length,'Recorded readings')+'</div>'+
 '<div class="panel"><h3>Vehicle Status</h3>'+vehicleTable(v)+'</div>';
}
function card(label,value,note,tone){return '<div class="card"><h3>'+esc(label)+'</h3><div class="big-number">'+Number(value||0).toLocaleString()+'</div><div class="sub">'+esc(note)+'</div></div>';}
function vehicleTable(rows){if(!rows.length)return '<div class="empty">No vehicle records yet. Vehicle data will be loaded from the real backup in the migration phase.</div>';
 return '<div class="table-wrap"><table><thead><tr><th>Plate</th><th>Make / Model</th><th>Site</th><th>Driver</th><th>Current KM</th><th>Oil Remaining</th><th>Status</th></tr></thead><tbody>'+rows.map(v=>'<tr><td><b>'+esc(v.plate)+'</b></td><td>'+esc((v.make||'')+' '+(v.model||''))+'</td><td>'+esc(v.site||'-')+'</td><td>'+esc(v.assigned_driver||'-')+'</td><td>'+fmt(v.current_km)+'</td><td>'+fmt(v.remaining)+' km</td><td>'+status(v.status)+'</td></tr>').join('')+'</tbody></table></div>';
}
function vehiclesHtml(v){
 const admin=USER.role==='Owner'||USER.role==='Admin'||USER.role==='FleetSupervisor';
 return '<div class="page-title"><div><h2>🚙 Vehicle Master</h2><p>Vehicle identity, driver assignment and current status.</p></div>'+(admin?'<button class="btn primary" onclick="toggleVehicleForm()">+ Add Vehicle</button>':'')+'</div>'+
 '<div id="vehicleFormWrap" class="panel hidden"><h3>Add Vehicle</h3><form onsubmit="addVehicleForm(event)"><div class="form-row"><div><label>Plate</label><input id="newPlate" required></div><div><label>Make</label><input id="newMake"></div><div><label>Model</label><input id="newModel"></div><div><label>Year</label><input id="newYear"></div><div><label>Site</label><input id="newSite"></div><div><label>Assigned Driver</label><input id="newDriver"></div><div><label>Driver Phone</label><input id="newPhone"></div><div><label>Current KM</label><input id="newKm" type="number" min="0" value="0"></div><div><label>Last Oil KM</label><input id="newOilKm" type="number" min="0" value="0"></div><div><label>Oil Interval KM</label><input id="newInterval" type="number" min="1000" value="5000"></div><div><label>Vehicle Access Code (optional)</label><input id="newPin" type="password" minlength="4" placeholder="Not required for shared Driver Portal"></div></div><div class="form-actions"><button class="btn primary">Save Vehicle</button><button type="button" class="btn secondary" onclick="toggleVehicleForm()">Cancel</button></div></form></div>'+
 '<div class="panel">'+vehicleTable(v)+'</div>';
}
function toggleVehicleForm(){document.getElementById('vehicleFormWrap').classList.toggle('hidden');}
async function addVehicleForm(e){e.preventDefault();try{await rpc('addVehicle',TOKEN,{plate:el('newPlate').value,make:el('newMake').value,model:el('newModel').value,year:el('newYear').value,site:el('newSite').value,driver:el('newDriver').value,phone:el('newPhone').value,currentKm:el('newKm').value,lastOilKm:el('newOilKm').value,oilIntervalKm:el('newInterval').value,vehiclePin:el('newPin').value});alert('Vehicle added. Give its access code only to its assigned drivers.');await refreshData();render();}catch(err){alert(err.message);}}
function kmHtml(v){
 if(USER.role==='Driver') return driverPortalHtml(v);
 const opts=v.map(x=>'<option value="'+esc(x.vehicle_id)+'">'+esc(x.plate)+'</option>').join('');
 return '<div class="page-title"><div><h2>📏 Daily KM Control</h2><p>Record the current odometer reading for the selected vehicle.</p></div></div><div class="panel"><form onsubmit="saveKm(event)"><div class="form-row"><div><label>Vehicle</label><select id="kmVehicle" required>'+opts+'</select></div><div><label>Current Odometer (KM)</label><input id="kmReading" type="number" min="0" required></div><div><label>Driver Name</label><input id="kmDriver" value="'+esc(USER.fullName||'')+'" required></div></div><label>Notes</label><textarea id="kmNotes"></textarea><div class="form-actions"><button class="btn success-btn">Save KM Reading</button></div></form></div><div class="panel"><h3>Recent KM Records</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Vehicle ID</th><th>Reading</th><th>Driver</th></tr></thead><tbody>'+(DATA.km||[]).slice(-30).reverse().map(r=>'<tr><td>'+esc(r.reading_date)+'</td><td>'+esc(r.vehicle_id)+'</td><td>'+fmt(r.reading_km)+'</td><td>'+esc(r.driver_name)+'</td></tr>').join('')+'</tbody></table></div></div>';
}
function driverPortalHtml(v){
 if(!DATA.selectedDriverName){
  const names=(DATA.driverNames||[]).map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');
  return '<div class="page-title"><div><h2>Fleet / Fleet vehicle and maintenance actions</h2><p>Driver Portal · Select your name to load your assigned vehicles.</p></div></div><div class="panel"><h3>👤 Select Driver</h3><form onsubmit="confirmDriverSelection(event)"><label>Driver Name</label><select id="driverSelect" required><option value="">Select your name</option>'+names+'</select><div class="form-actions"><button class="btn primary">Continue to Driver Portal</button></div></form><div class="alert info">Only vehicles assigned to the selected driver will be displayed. If your name or vehicle is missing, contact Fleet Admin.</div></div>';
 }
 const opts=v.map(x=>'<option value="'+esc(x.vehicle_id)+'">'+esc(x.plate)+'</option>').join('');
 const first=v[0];
 const rows=(DATA.km||[]).filter(r=>String(r.vehicle_id)===String(first?.vehicle_id)).slice(-12).reverse();
 return '<div class="page-title"><div><h2>Fleet / Fleet vehicle and maintenance actions</h2><p>Driver Portal · '+esc(DATA.selectedDriverName)+'</p></div><button class="btn secondary" onclick="changeDriverSelection()">Change Driver</button></div>'+
 '<div class="cards-grid"><button class="btn primary" onclick="showPage(\'km\')">📏 Add Daily KM</button><button class="btn primary" onclick="showPage(\'tickets\')">🛠️ Maintenance Issue Report</button><button class="btn primary" onclick="showPage(\'tires\')">🛞 Tire Service Request</button><button class="btn primary" onclick="showPage(\'tires\')">🛞 Tire Survey</button></div>'+
 '<div class="panel"><h3>Driver Portal</h3><div class="form-row"><div><label>Select Vehicle</label><select id="kmVehicle" onchange="renderDriverVehicleSummary()">'+opts+'</select></div><div><label>Today's Odometer Reading (km)</label><input id="kmReading" type="number" min="0" placeholder="Enter current reading"></div></div><div id="driverVehicleSummary">'+driverVehicleSummary(first)+'</div><label>Notes</label><textarea id="kmNotes" placeholder="Optional notes"></textarea><div class="form-actions"><button class="btn success-btn" onclick="saveDriverKm(event)">Save Reading</button><button class="btn secondary" onclick="driverOilChanged()">Oil Changed</button></div></div>'+
 '<div class="panel"><h3>Recent Readings</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Reading (km)</th><th>Oil</th><th>Notes</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.reading_date)+'</td><td>'+fmt(r.reading_km)+'</td><td>-</td><td>'+esc(r.notes||'-')+'</td></tr>').join('')+'</tbody></table></div></div>';
}
function driverVehicleSummary(v){
 if(!v)return '<div class="alert warning">No active vehicles are assigned to this driver.</div>';
 return '<div class="cards-grid"><div class="card"><h3>Plate</h3><div class="big-number">'+esc(v.plate)+'</div></div><div class="card"><h3>Driver</h3><div class="big-number" style="font-size:20px">'+esc(DATA.selectedDriverName)+'</div></div><div class="card"><h3>Location</h3><div class="big-number" style="font-size:20px">'+esc(v.site||'-')+'</div></div><div class="card"><h3>Current Odometer</h3><div class="big-number">'+fmt(v.current_km)+'</div></div><div class="card"><h3>Last Oil Change</h3><div class="big-number">'+fmt(v.last_oil_km)+'</div></div><div class="card"><h3>KM Since Oil Change</h3><div class="big-number">'+fmt(v.sinceOil)+'</div></div><div class="card"><h3>Remaining to Next Oil</h3><div class="big-number">'+fmt(v.remaining)+'</div></div><div class="card"><h3>Status</h3>'+status(v.status)+'</div></div>';
}
function renderDriverVehicleSummary(){
 const id=el('kmVehicle')?.value, v=(DATA.vehicles||[]).find(x=>String(x.vehicle_id)===String(id));
 el('driverVehicleSummary').innerHTML=driverVehicleSummary(v);
}
async function confirmDriverSelection(e){
 e.preventDefault();try{const r=await rpc('selectDriver',TOKEN,el('driverSelect').value);USER.selectedDriverName=r.driverName;await refreshData();document.getElementById('userLabel').textContent=r.driverName+' · Driver';render();}catch(err){alert(err.message);}
}
async function changeDriverSelection(){
 try{await rpc('selectDriver',TOKEN,'');}catch(e){}
 USER.selectedDriverName='';DATA.selectedDriverName='';await refreshData();render();
}
async function saveDriverKm(e){
 e.preventDefault();const id=el('kmVehicle').value,reading=el('kmReading').value;
 if(!reading){alert('Enter today’s odometer reading.');return;}
 try{await rpc('submitKm',TOKEN,{vehicleId:id,readingKm:reading,notes:el('kmNotes').value});alert('KM reading saved.');await refreshData();render();}catch(err){alert(err.message);}
}
async function driverOilChanged(){
 const id=el('kmVehicle').value, v=(DATA.vehicles||[]).find(x=>String(x.vehicle_id)===String(id));
 const km=Number(el('kmReading').value||v.current_km);
 if(!confirm('Confirm that the oil has been changed for '+v.plate+' at '+km+' km?'))return;
 try{
  if(km>Number(v.current_km||0)) await rpc('submitKm',TOKEN,{vehicleId:id,readingKm:km,notes:'Odometer reading recorded with oil change'});
  await rpc('recordOilChange',TOKEN,{vehicleId:id,readingKm:km,oilType:'',notes:'Recorded from Driver Portal'});
  alert('Oil change recorded.');await refreshData();render();
 }catch(err){alert(err.message);}
}
function oilHtml(v){return '<div class="page-title"><div><h2>🛢️ Engine Oil Control</h2><p>Oil interval, last change and due status.</p></div></div><div class="panel"><form onsubmit="saveOil(event)"><div class="form-row"><div><label>Vehicle</label><select id="oilVehicle" required>'+v.map(x=>'<option value="'+esc(x.vehicle_id)+'">'+esc(x.plate)+'</option>').join('')+'</select></div><div><label>Oil-change KM</label><input id="oilReading" type="number" min="0" required></div><div><label>Oil Type</label><input id="oilType" placeholder="e.g. 5W30"></div></div><label>Notes</label><textarea id="oilNotes"></textarea><div class="form-actions"><button class="btn primary">Record Oil Change</button></div></form></div><div class="panel">'+vehicleTable(v)+'</div>';}
function ticketsHtml(rows){return '<div class="page-title"><div><h2>🎫 Vehicle Maintenance & Tickets</h2><p>Report and follow vehicle issues.</p></div></div><div class="panel"><form onsubmit="saveTicket(event)"><div class="form-row"><div><label>Vehicle</label><select id="ticketVehicle" required>'+(DATA.vehicles||[]).map(v=>'<option value="'+esc(v.vehicle_id)+'">'+esc(v.plate)+'</option>').join('')+'</select></div><div><label>Category</label><select id="ticketCategory"><option>Maintenance</option><option>Mechanical</option><option>Electrical</option><option>Tires</option><option>Accident</option></select></div><div><label>Priority</label><select id="ticketPriority"><option>Normal</option><option>High</option><option>Urgent</option></select></div></div><label>Issue Title</label><input id="ticketTitle" required><label>Description</label><textarea id="ticketDescription" required></textarea><div class="form-actions"><button class="btn primary">Submit Request</button></div></form></div><div class="panel"><h3>Requests Register</h3><div class="table-wrap"><table><thead><tr><th>Vehicle</th><th>Category</th><th>Title</th><th>Reported By</th><th>Date</th><th>Status</th></tr></thead><tbody>'+rows.map(t=>'<tr><td>'+esc(vehiclePlate(t.vehicle_id))+'</td><td>'+esc(t.category)+'</td><td>'+esc(t.title)+'</td><td>'+esc(t.reported_by)+'</td><td>'+esc(t.reported_at)+'</td><td>'+status(t.status)+'</td></tr>').join('')+'</tbody></table></div></div>';}
function canManageFleet(){return ['Owner','Admin','FleetSupervisor'].includes(USER.role);}
function tiresHtml(rows,vehicles){
 const opts=vehicles.map(v=>'<option value="'+esc(v.vehicle_id)+'">'+esc(v.plate)+'</option>').join('');
 return '<div class="page-title"><div><h2>🛞 Tire Management</h2><p>Submit and track tire service requests.</p></div><button class="btn secondary" onclick="refreshAndRender()">↻ Refresh</button></div>'+
 '<div class="panel"><h3>New Tire Service Request</h3><form onsubmit="submitTireForm(event)"><div class="form-row"><div><label>Vehicle</label><select id="tireVehicle" required>'+opts+'</select></div><div><label>Request Type</label><select id="tireType"><option>Tire Inspection</option><option>Tire Replacement</option><option>Tire Repair</option><option>Tire Rotation</option><option>Tire Survey</option></select></div></div><label>Description / Tire Condition</label><textarea id="tireDescription" required></textarea><div class="form-actions"><button class="btn primary">Submit Tire Request</button></div></form></div>'+
 '<div class="panel"><h3>Tire Requests Register</h3><div class="table-wrap"><table><thead><tr><th>Vehicle</th><th>Type</th><th>Description</th><th>Requested By</th><th>Date</th><th>Status</th>'+(canManageFleet()?'<th>Action</th>':'')+'</tr></thead><tbody>'+
 (rows.length?rows.slice().reverse().map(x=>'<tr><td>'+esc(vehiclePlate(x.vehicle_id))+'</td><td>'+esc(x.request_type)+'</td><td>'+esc(x.description)+'</td><td>'+esc(x.requested_by)+'</td><td>'+esc(x.requested_at)+'</td><td>'+status(x.status)+'</td>'+(canManageFleet()?'<td><select id="tireStatus_'+esc(x.request_id)+'"><option>Open</option><option>In Progress</option><option>Completed</option><option>Rejected</option></select><button class="btn primary" onclick="changeTireStatus(\''+esc(x.request_id)+'\')">Save</button></td>':'')+'</tr>').join(''):'<tr><td colspan="7" class="empty">No tire requests recorded.</td></tr>')+'</tbody></table></div></div>';
}
function inspectionsHtml(rows,vehicles){
 const opts=vehicles.map(v=>'<option value="'+esc(v.vehicle_id)+'">'+esc(v.plate)+'</option>').join('');
 const form=canManageFleet()?'<div class="panel"><h3>Schedule Inspection</h3><form onsubmit="saveInspectionForm(event)"><div class="form-row"><div><label>Vehicle</label><select id="inspVehicle" required>'+opts+'</select></div><div><label>Inspection Type</label><select id="inspType"><option>Annual</option><option>6-Month</option></select></div><div><label>Due Date</label><input id="inspDue" type="date" required></div><div><label>Estimated / Actual Cost (SAR)</label><input id="inspCost" type="number" min="0" step="0.01" value="0"></div></div><label>Notes</label><textarea id="inspNotes"></textarea><div class="form-actions"><button class="btn primary">Save Inspection</button></div></form></div>':'';
 return '<div class="page-title"><div><h2>📅 Annual & 6-Month Inspections</h2><p>Schedule and track vehicle compliance inspections.</p></div><button class="btn secondary" onclick="refreshAndRender()">↻ Refresh</button></div>'+form+
 '<div class="panel"><h3>Inspection Register</h3><div class="table-wrap"><table><thead><tr><th>Vehicle</th><th>Type</th><th>Due Date</th><th>Completed</th><th>Cost (SAR)</th><th>Status</th>'+(canManageFleet()?'<th>Action</th>':'')+'</tr></thead><tbody>'+
 (rows.length?rows.slice().reverse().map(x=>'<tr><td>'+esc(vehiclePlate(x.vehicle_id))+'</td><td>'+esc(x.inspection_type)+'</td><td>'+esc(x.due_date)+'</td><td>'+esc(x.completed_date||'-')+'</td><td>'+fmt(x.cost)+'</td><td>'+status(x.status)+'</td>'+(canManageFleet()?'<td><select id="inspStatus_'+esc(x.record_id)+'"><option>Pending</option><option>Completed</option><option>Overdue</option></select><button class="btn primary" onclick="changeInspectionStatus(\''+esc(x.record_id)+'\')">Save</button></td>':'')+'</tr>').join(''):'<tr><td colspan="7" class="empty">No inspections scheduled.</td></tr>')+'</tbody></table></div></div>';
}
async function submitTireForm(e){e.preventDefault();try{await rpc('createTireRequest',TOKEN,{vehicleId:el('tireVehicle').value,requestType:el('tireType').value,description:el('tireDescription').value});alert('Tire request submitted.');await refreshData();render();}catch(err){alert(err.message);}}
async function changeTireStatus(id){try{await rpc('updateTireRequest',TOKEN,id,el('tireStatus_'+id).value,'');await refreshData();render();}catch(err){alert(err.message);}}
async function saveInspectionForm(e){e.preventDefault();try{await rpc('saveInspection',TOKEN,{vehicleId:el('inspVehicle').value,inspectionType:el('inspType').value,dueDate:el('inspDue').value,cost:el('inspCost').value,notes:el('inspNotes').value});alert('Inspection saved.');await refreshData();render();}catch(err){alert(err.message);}}
async function changeInspectionStatus(id){try{await rpc('updateInspection',TOKEN,id,el('inspStatus_'+id).value,'',0);await refreshData();render();}catch(err){alert(err.message);}}
async function loadAuditPage(){const root=document.getElementById('mainContent');root.innerHTML='<div class="loading">Loading audit log…</div>';try{const rows=await rpc('getAuditLog',TOKEN);root.innerHTML='<div class="page-title"><div><h2>Audit Log</h2><p>Recent system activity.</p></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Date</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.created_at)+'</td><td>'+esc(r.actor)+'</td><td>'+esc(r.action)+'</td><td>'+esc(r.entity)+'</td><td>'+esc(r.details)+'</td></tr>').join('')+'</tbody></table></div></div>';}catch(e){root.innerHTML='<div class="alert error">'+esc(e.message)+'</div>';}}
function placeholderHtml(p){
 const labels={inspections:'Annual & 6-Month Inspections',tires:'Tire Management',handovers:'Driver Handovers',reports:'Fleet Reports', 'advanced-reports':'Advanced Reports',audit:'Audit Log',drivers:'Driver Management',users:'User Management',backup:'Backup & Restore', 'support-service':'Support & Service',troubleshooter:'Fleet Troubleshooter',warehouse:'Warehouse Management'};
 const title=labels[p]||p;
 return '<div class="page-title"><div><h2>'+esc(title)+'</h2><p>Fleet ERP module</p></div><span class="badge warning">Migration in progress</span></div><div class="panel"><h3>'+esc(title)+'</h3><p class="muted">This screen is included in the rebuilt navigation. Its production workflow and data actions are being migrated and validated before activation. No production data has been imported or changed.</p></div>';
}
async function saveKm(e){e.preventDefault();try{await rpc('submitKm',TOKEN,{vehicleId:el('kmVehicle').value,readingKm:el('kmReading').value,notes:el('kmNotes').value});alert('KM reading saved.');await refreshData();render();}catch(err){alert(err.message);}}
async function saveOil(e){e.preventDefault();try{await rpc('recordOilChange',TOKEN,{vehicleId:el('oilVehicle').value,readingKm:el('oilReading').value,oilType:el('oilType').value,notes:el('oilNotes').value});alert('Oil change recorded.');await refreshData();render();}catch(err){alert(err.message);}}
async function saveTicket(e){e.preventDefault();try{await rpc('createTicket',TOKEN,{vehicleId:el('ticketVehicle').value,category:el('ticketCategory').value,priority:el('ticketPriority').value,title:el('ticketTitle').value,description:el('ticketDescription').value});alert('Request submitted.');await refreshData();render();}catch(err){alert(err.message);}}
async function refreshAndRender(){try{await refreshData();render();}catch(e){alert(e.message);}}
function vehiclePlate(id){const v=(DATA.vehicles||[]).find(x=>String(x.vehicle_id)===String(id));return v?v.plate:id;}
function fmt(n){return Number(n||0).toLocaleString();}
function status(s){const c=s==='Safe'||s==='Closed'?'safe':s==='Warning'?'warning':'urgent';return '<span class="badge '+c+'">'+esc(s||'Open')+'</span>';}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
