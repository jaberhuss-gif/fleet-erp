// =============================================
// Custom Modals
// =============================================
function customConfirm(message, callback) {
  var modalEl = document.getElementById('confirmModal');
  if (!modalEl) {
    var result = confirm(message);
    callback(result);
    return;
  }
  var modal = new bootstrap.Modal(modalEl);
  document.getElementById('confirmModalBody').textContent = message;
  var btn = document.getElementById('confirmModalBtn');
  var newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  window._confirmClicked = false;
  newBtn.addEventListener('click', function() {
    window._confirmClicked = true;
    modal.hide();
    callback(true);
  });
  modalEl.addEventListener('hidden.bs.modal', function onHidden() {
    if (!window._confirmClicked) {
      callback(false);
    }
    window._confirmClicked = false;
    modalEl.removeEventListener('hidden.bs.modal', onHidden);
  });
  modal.show();
}

function customAlert(message, title) {
  var modalEl = document.getElementById('alertModal');
  if (!modalEl) {
    alert(message);
    return;
  }
  var modal = new bootstrap.Modal(modalEl);
  document.getElementById('alertModalBody').textContent = message;
  var header = document.getElementById('alertModalHeader');
  var titleEl = document.getElementById('alertModalTitle');
  if (title) {
    titleEl.textContent = title;
    if (title.includes('✅') || title.includes('success')) {
      header.className = 'modal-header bg-success text-white';
    } else if (title.includes('❌') || title.includes('خطأ')) {
      header.className = 'modal-header bg-danger text-white';
    } else {
      header.className = 'modal-header bg-primary text-white';
    }
  } else {
    titleEl.textContent = '📢 alert';
    header.className = 'modal-header bg-primary text-white';
  }
  modal.show();
}

function customPrompt(message, callback) {
  var modalEl = document.getElementById('promptModal');
  if (!modalEl) {
    var result = prompt(message);
    callback(result);
    return;
  }
  var modal = new bootstrap.Modal(modalEl);
  document.getElementById('promptModalLabel').textContent = message;
  document.getElementById('promptModalInput').value = '';
  setTimeout(function() {
    document.getElementById('promptModalInput').focus();
  }, 300);
  var btn = document.getElementById('promptModalBtn');
  var newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  newBtn.addEventListener('click', function() {
    var value = document.getElementById('promptModalInput').value;
    modal.hide();
    callback(value);
  });
  document.getElementById('promptModalInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var value = document.getElementById('promptModalInput').value;
      modal.hide();
      callback(value);
    }
  });
  modal.show();
}

}

function handleLogin() {
  var username = document.getElementById('loginUsername').value.trim();
  var password = document.getElementById('loginPassword').value.trim();
  var messageEl = document.getElementById('loginMessage');
  
  var users = {
    'admin': 'admin123',
    'manager': 'manager123'
  };
  
  if (!username || !password) {
    messageEl.style.display = 'block';
    messageEl.style.background = '#fef2f2';
    messageEl.style.color = '#dc2626';
    messageEl.innerHTML = '⚠️ Please enter both username and password';
    return;
  }
  
  if (users[username] && users[username] === password) {
    CURRENT_USER = username;
    messageEl.style.display = 'block';
    messageEl.style.background = '#f0fdf4';
    messageEl.style.color = '#16a34a';
    messageEl.innerHTML = '✅ Login successful! Redirecting...';
    
    if (username === 'admin') {
      USER_ROLE = 'admin';
    } else {
      USER_ROLE = 'manager';
    }
    
    var adminMenu = document.getElementById('adminMenu');
    if (adminMenu) {
      adminMenu.style.display = (USER_ROLE === 'admin') ? 'block' : 'none';
    }
    
    setTimeout(function() {
      loadPage('dashboard');
    }, 1000);
    
  } else {
    messageEl.style.display = 'block';
    messageEl.style.background = '#fef2f2';
    messageEl.style.color = '#dc2626';
    messageEl.innerHTML = '❌ Invalid username or password';
  }
}

function loadVehicleManagementReport() {
  var content = document.getElementById("content");
  if (!content) return;

  content.innerHTML = `
    <div style="display:flex; justify-content:center; align-items:center; min-height:300px; flex-direction:column; color:#64748b;">
      <div class="spinner-border text-primary" role="status"></div>
      <h5 style="margin-top:15px;">Loading Vehicle Maintenance Report...</h5>
    </div>
  `;

  google.script.run
    .withSuccessHandler(function(data) {
      console.log("✅ Vehicle Report Data:", data);
      if (data && data.error) {
        content.innerHTML = `<div class="alert alert-danger">❌ Error: ${data.error}</div>`;
        return;
      }
      if (!data || !data.summary) {
        content.innerHTML = `<div class="alert alert-warning">⚠️ No data available. Please try again.</div>`;
        return;
      }
      renderVehicleReportAdvanced(data);
    })
    .withFailureHandler(function(error) {
      console.error("❌ Server error:", error);
      content.innerHTML = `<div class="alert alert-danger">Error: ${error.message || error}</div>`;
    })
    .getVehicleReportAdvanced();  // ✅ استخدم الدالة الجديدة
}

function loadPage(page) {
  console.log("📄 loadPage:", page);

  var content = document.getElementById("content");
  if (!content) return;

  try {
    if (!CURRENT_USER) {
      showLoginPage();
      return;
    }

    if (USER_ROLE === 'manager' && page !== 'dashboard') {
      customAlert(
        "⛔ غير مصرح لك بالدخول! أنت تملك صلاحية الوصول إلى لوحة التحكم فقط.",
        "🚫 ممنوع"
      );
      return;
    }

    if (page === "dashboard") {
      renderDashboard();

    } else if (page === "sites") {
      renderSites();

    } else if (page === "workorders") {
      renderWorkOrders();

    } else if (page === "financialReports") {
      renderFinancialReports();

   
    } else if (page === "devprojects") {
      renderDevProjects();

    } else if (page === "vehicleReport") {
      loadVehicleManagementReport();   // ✅ التغيير هنا

    } else {
      content.innerHTML = "<h2>Page not found</h2>";
    }

  } catch(e) {
    console.error("❌ Error in loadPage:", e);
    content.innerHTML =
      '<div class="alert alert-danger">❌ Error: ' +
      e.message +
      '</div>';
  }
}

// ================= DEVELOPMENT PROJECTS MONTHLY REPORT =================
function loadCompletedDevProjects() {
  var container = document.getElementById('completedDevContainer');
  if (!container) return;

  google.script.run
    .withSuccessHandler(function(data) {

      console.log("📊 Development Projects Monthly:", data);

      if (!data || data.length === 0) {
        container.innerHTML =
          '<p class="text-muted text-center">📭 No development projects found</p>';
        return;
      }

      var today = new Date();
      var currentYear = today.getFullYear();
      var currentMonth = today.getMonth();

      var monthName = today.toLocaleString('default', {
        month: 'long'
      }) + ' ' + currentYear;

      var completedProjects = data.filter(function(project) {

        var status = String(project.status || '')
          .trim()
          .toLowerCase();

        if (status !== 'completed' && status !== 'closed') {
          return false;
        }

        if (!project.endDate) {
          return false;
        }

        var projectDate = new Date(project.endDate);

        if (isNaN(projectDate.getTime())) {
          return false;
        }

        return (
          projectDate.getFullYear() === currentYear &&
          projectDate.getMonth() === currentMonth
        );
      });

      if (completedProjects.length === 0) {

        container.innerHTML = `
          <div class="text-center text-muted py-4">
            <div style="font-size: 35px;">📭</div>
            <p class="mb-1">
              No completed development projects for
              <strong>${monthName}</strong>
            </p>
            <small>
              Completed projects from previous months are retained in the sheet.
            </small>
          </div>
        `;

        return;
      }

      var grandTotal = 0;

      completedProjects.forEach(function(project) {
        grandTotal += Number(project.totalCost) || 0;
      });

      var html = `
        <div class="card shadow-sm mb-4">

          <div class="card-header bg-success text-white
                      d-flex justify-content-between
                      align-items-center">

            <strong>📅 ${monthName}</strong>

            <span class="badge bg-light text-dark">
              ${completedProjects.length}
              Completed Project${completedProjects.length !== 1 ? 's' : ''}
            </span>

          </div>

          <div class="card-body p-0">

            <div class="table-responsive">

              <table class="table table-striped table-hover mb-0"
                     style="font-size: 14px;">

                <thead style="background-color: #198754; color: white;">

                  <tr>
                    <th>#</th>
                    <th>Project ID</th>
                    <th>Project Name</th>
                    <th>Description</th>
                    <th>Contractor</th>
                    <th>Total Cost (SAR)</th>
                  </tr>

                </thead>

                <tbody>
      `;

      completedProjects.forEach(function(project, index) {

        var projectCost = Number(project.totalCost) || 0;

        html += `
          <tr>

            <td>${index + 1}</td>

            <td>
              <strong>${project.id || '-'}</strong>
            </td>

            <td>
              ${project.name || '-'}
            </td>

            <td>
              ${project.description || '-'}
            </td>

            <td>
              ${project.contractor || '-'}
            </td>

            <td>
              ${projectCost.toLocaleString()} SAR
            </td>

          </tr>
        `;
      });

      html += `
                </tbody>

              </table>

            </div>

          </div>

          <div class="card-footer bg-light text-center">

            <strong>
              💰 ${monthName} Total:
              ${grandTotal.toLocaleString()} SAR
            </strong>

            <span class="text-muted ms-2">
              (${completedProjects.length} Completed Projects)
            </span>

          </div>

        </div>
      `;

      container.innerHTML = html;
    })

    .withFailureHandler(function(err) {

      console.error(
        "❌ Error loading development projects:",
        err
      );

      container.innerHTML = `
        <div class="alert alert-danger">

          ❌ Error: ${err.message || 'Unknown'}

          <br>

          <button
            class="btn btn-sm btn-primary mt-2"
            onclick="loadCompletedDevProjects()">
            🔄 Retry
          </button>

        </div>
      `;
    })

    .getDevProjects();
}

// ================= SITE TASKS =================
function loadSiteTasks() {
  var container = document.getElementById('siteTasksContainer');
  if (!container) return;
  
  google.script.run
    .withSuccessHandler(function(result) {
      console.log("📊 Site Tasks:", result);
      var summary = {};
      try { summary = JSON.parse(result); } catch(e) { summary = {}; }
      
      var sites = Object.keys(summary);
      if (sites.length === 0) {
        container.innerHTML = `
          <div class="text-center text-muted py-4">
            <p>📭 No site tasks found</p>
            <button class="btn btn-sm btn-primary" onclick="openSiteTaskModal()">➕ Add Task</button>
          </div>
        `;
        return;
      }
      
      var html = `
        <div class="table-responsive">
          <table class="table table-striped table-hover" style="font-size: 14px;">
            <thead style="background-color: #0d6efd; color: white;">
              <tr>
                <th>#</th>
                <th>ID</th>
                <th>Site Name</th>
                <th>Task Description</th>
                <th>Start Date</th>
                <th>Close Date</th>
                <th>Amount (SAR)</th>
                <th>Status</th>
                <th>Assigned To</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
      `;
      
      var rowNumber = 0;
      var grandTotal = 0;
      
      for (var s in summary) {
        var data = summary[s];
        var tasks = data.tasks || [];
        
        for (var i = 0; i < tasks.length; i++) {
          var task = tasks[i];
          rowNumber++;
          
          var isClosed = (task.status === 'Closed');
          var statusBadge = isClosed 
            ? '<span class="badge bg-success">✅ Closed</span>' 
            : '<span class="badge bg-warning text-dark">🔄 Open</span>';
          
          var startDate = task.startDate ? new Date(task.startDate).toLocaleDateString() : '-';
          var closeDate = task.closeDate ? new Date(task.closeDate).toLocaleDateString() : '-';
          var amount = isClosed ? task.amount : '-';
          
          if (isClosed) grandTotal += Number(task.amount) || 0;
          
          var actionButton = isClosed 
            ? '✅ Closed' 
            : `<button class="btn btn-sm btn-danger" onclick="closeSiteTaskFromDashboard('${task.id}')">🔒 Close</button>`;
          
          html += `
            <tr>
              <td>${rowNumber}</td>
              <td><strong>${task.id || '-'}</strong></td>
              <td>${s}</td>
              <td>${task.description || '-'}</td>
              <td>${startDate}</td>
              <td>${closeDate}</td>
              <td>${amount}</td>
              <td>${statusBadge}</td>
              <td>${task.assignedTo || '-'}</td>
              <td>${actionButton}</td>
            </tr>
          `;
        }
      }
      
      html += `
            </tbody>
          </table>
        </div>
      `;
      
      if (grandTotal > 0) {
        html += `
          <div class="card bg-success text-white mt-3">
            <div class="card-body text-center">
              <h5>💰 Total Cost of Closed Tasks</h5>
              <h3>${grandTotal.toLocaleString()} SAR</h3>
            </div>
          </div>
        `;
      }
      
      container.innerHTML = html;
    })
    .withFailureHandler(function(err) {
      container.innerHTML = `
        <div class="alert alert-danger">
          ❌ Error: ${err.message || 'Unknown'}
          <br>
          <button class="btn btn-sm btn-primary mt-2" onclick="loadSiteTasks()">🔄 Retry</button>
        </div>
      `;
    })
    .getSiteTasksSummary();
}

function loadContractorReport() {
  var container = document.getElementById('contractorReportContainer');
  if (!container) return;
  
  google.script.run
    .withSuccessHandler(function(data) {
      console.log("📊 Contractor Report:", data);
      
      var contractors = Object.keys(data);
      if (contractors.length === 0) {
        container.innerHTML = '<p class="text-muted text-center">📭 No contractor data found</p>';
        return;
      }
      
      var html = `
        <div class="table-responsive">
          <table class="table table-striped table-hover" style="font-size: 14px;">
            <thead style="background-color: #212529; color: white;">
              <tr>
                <th>#</th>
                <th>Contractor Name</th>
                <th>Monthly Total (SAR)</th>
                <th>Months</th>
              </tr>
            </thead>
            <tbody>
      `;
      
      var rowNumber = 0;
      var grandTotal = 0;
      
      contractors.sort(function(a, b) {
        return (data[b].total || 0) - (data[a].total || 0);
      });
      
      for (var i = 0; i < contractors.length; i++) {
        var contractor = contractors[i];
        var info = data[contractor];
        rowNumber++;
        grandTotal += info.total || 0;
        
        var monthsHtml = '';
        var monthKeys = Object.keys(info.months || {});
        monthKeys.sort();

// ================= CLOSE SITE TASK FROM DASHBOARD =================
function closeSiteTaskFromDashboard(taskId) {
  customConfirm("Are you sure you want to close this task?", function(confirmed) {
    if (!confirmed) return;
    
    customPrompt("💰 Enter total cost for this task (SAR):", function(amount) {
      if (amount === null || amount === undefined) return;
      
      amount = amount.replace(/,/g, '').trim();
      
      if (isNaN(amount) || amount < 0) {
        customAlert("⚠️ Please enter a valid amount (0 or more)", "خطأ");
        return;
      }
      
      google.script.run
        .withSuccessHandler(function(msg) {
          customAlert(msg, "✅ نجاح");
          loadSiteTasks();
        })
        .withFailureHandler(function(err) {
          customAlert("❌ Error: " + err.message, "خطأ");
        })
        .closeSiteTask(taskId, { 
          amount: amount,
          closeDate: new Date().toISOString().split('T')[0]
        });
    });
  });
}

// ================= VIEW FULL IMAGE =================
function viewFullImage(imageSrc) {
  var modal = document.createElement('div');
  modal.style.cssText = `
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    cursor: pointer;
  `;
  modal.onclick = function() { this.remove(); };
  var img = document.createElement('img');
  img.src = imageSrc;
  img.style.cssText = `
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    object-fit: contain;
  `;
  img.onclick = function(e) { e.stopPropagation(); };
  modal.appendChild(img);
  document.body.appendChild(modal);
}

// ================= OPEN WO MODAL =================
function openWOModal() {
  var modalElement = document.getElementById('woModal');
  if (!modalElement) {
    console.error("❌ woModal not found!");
    return;
  }
  
  var fields = ['woSite', 'woArea', 'woDescription', 'woAssignedTo', 'woContractor', 'woDate', 'woImage'];
  fields.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  
  var category = document.getElementById('woCategory');
  if (category) category.value = 'Plumbing';
  
  var priority = document.getElementById('woPriority');
  if (priority) priority.value = 'Medium';
  
  var modal = new bootstrap.Modal(modalElement);
  modal.show();
}

// ============================================================
// HELPER: FORMAT NUMBERS
// ============================================================
function formatNumber(number) {
    if (number === undefined || number === null || isNaN(number)) return '0';
    return Number(number).toLocaleString('en-US', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    });
}

function renderGallery() {
  var content = document.getElementById("content");
  content.innerHTML = `
    <h2>🖼️ Gallery</h2>
    <p class="text-muted">Click on any image to view full size</p>
    <div id="galleryContainer">
      <div class="text-center"><div class="spinner-border"></div><p>Loading images...</p></div>
    </div>
  `;
  
  google.script.run
    .withSuccessHandler(function(data) {
      console.log("✅ Gallery Data received:", data);
      console.log("📊 Number of images:", data ? data.length : 0);
      
      var container = document.getElementById("galleryContainer");
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-muted text-center">📭 No images found</p>';
        return;
      }
      
      var html = '<div class="row g-3">';
      var count = 0;
      
      for (var i = 0; i < data.length; i++) {
        var item = data[i];
        var imageData = item.image || '';
        var source = item.source || '';
        var reference = item.reference || '';
        var site = item.site || '';
        
        if (imageData && imageData.length > 10) {
          if (!imageData.startsWith("data:image")) {
            imageData = "data:image/jpeg;base64," + imageData;
          }
          count++;
          
          var badgeColor = '';
          if (source === 'Work Order') badgeColor = 'bg-danger';
          else if (source === 'Development Project') badgeColor = 'bg-success';
          else if (source === 'Site Task') badgeColor = 'bg-info';
          else badgeColor = 'bg-secondary';
          
          html += `
            <div class="col-md-3 col-sm-4 col-6">
              <div class="card gallery-card shadow-sm h-100">
                <img src="${imageData}" 
                     class="card-img-top gallery-img" 
                     style="height:200px;object-fit:cover;cursor:pointer;border-radius:8px 8px 0 0;"
                     onclick="viewFullImage('${imageData}')"
                     loading="lazy"
                     alt="${reference}">
                <div class="card-body text-center p-2">
                  <small class="text-muted">📋 ${reference}</small>
                  ${site ? `<br><small class="text-muted">📍 ${site}</small>` : ''}
                  <br><span class="badge ${badgeColor}" style="font-size:10px;">${source}</span>
                </div>
              </div>
            </div>
          `;
        }
      }
      
      html += '</div>';
      if (count === 0) {
        html = '<p class="text-muted text-center">📭 No images found</p>';
      }
      
      container.innerHTML = html;
      console.log("✅ Gallery rendered with " + count + " images");
    })
    .withFailureHandler(function(err) {
      console.error("❌ Gallery Error:", err);
      document.getElementById("galleryContainer").innerHTML = '<div class="alert alert-danger">❌ Error: ' + err.message + '</div>';
    })

}

// ================= CLOSE DEVELOPMENT PROJECT =================
function closeDevProject(projectId) {
  customConfirm("Are you sure you want to close this project?", function(confirmed) {
    if (!confirmed) return;
    
    customPrompt("💰 Enter total project cost (SAR):", function(totalCost) {
      if (totalCost === null || totalCost === undefined) return;
      
      totalCost = totalCost.replace(/,/g, '').trim();
      if (isNaN(totalCost) || totalCost < 0) {
        customAlert("⚠️ Please enter a valid amount (0 or more)", "خطأ");
        return;
      }
      
      customPrompt("💰 Enter contractor cost (SAR):", function(contractorCost) {
        if (contractorCost === null || contractorCost === undefined) return;
        
        contractorCost = contractorCost.replace(/,/g, '').trim();
        if (isNaN(contractorCost) || contractorCost < 0) {
          customAlert("⚠️ Please enter a valid amount (0 or more)", "خطأ");
          return;
        }
        
        customPrompt("📝 Enter closing notes:", function(notes) {
          if (notes === null || notes === undefined) return;
          if (notes.trim() === "") {
            customAlert("⚠️ Please enter some notes before closing", "خطأ");
            return;
          }
          
          google.script.run
            .withSuccessHandler(function(msg) {
              customAlert(msg, "✅ نجاح");
              loadPage('devprojects');
            })
            .withFailureHandler(function(err) {
              customAlert("❌ Error: " + err.message, "خطأ");
            })
            .closeDevProject(projectId, { 
              totalCost: totalCost,
              contractorCost: contractorCost,
              notes: notes
            });
        });
      });
    });
  });
}

      var maxCount = data[0] ? data[0].count : 1;
      
      var html = `
        <table class="mini-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Site</th>
              <th>WO</th>
              <th>Progress</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      for (var i = 0; i < data.length; i++) {
        var item = data[i];
        var percent = Math.round((item.count / maxCount) * 100);
        
        html += `
          <tr>
            <td>${i + 1}</td>
            <td>${item.site}</td>
            <td><span class="badge-wo">${item.count}</span></td>
            <td>
              <div class="progress-bar-mini">
                <div class="fill" style="width:${percent}%;"></div>
              </div>
            </td>
          </tr>
        `;
      }
      
      html += `
          </tbody>
        </table>
      `;
      
      container.innerHTML = html;
    })
    .withFailureHandler(function(err) {
      container.innerHTML = '<p style="text-align:center;color:#ef4444;font-size:12px;padding:8px 0;">❌ ' + err.message + '</p>';
    })
    .getWorkOrdersPerSite();
}
