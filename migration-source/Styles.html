<style>
  /* ================= القائمة الجانبية ================= */
  .sidebar {
    background: #0f172a;
    color: #fff;
    height: 100vh;
    padding: 20px;
    position: sticky;
    top: 0;
    overflow-y: auto;
  }
  .sidebar h4 {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.5px;
    margin-bottom: 25px;
  }
  .sidebar h4 span {
    color: #60a5fa;
  }
  .nav-link {
    color: #94a3b8;
    cursor: pointer;
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 4px;
    transition: all 0.2s ease;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-link:hover {
    background: #1e293b;

    font-size: 18px;
  }

  /* ================= كروت Dashboard الحديثة ================= */
  /* الصف الأول: الإحصائيات الأساسية */
  .dashboard-stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
    margin-bottom: 18px;
  }

  /* الصف الثاني: التكاليف والمصاريف */
  .dashboard-stats-row:last-of-type {
    margin-bottom: 30px;
  }

  .stat-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px 18px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    border-left: 5px solid;
    position: relative;
    overflow: hidden;
  }

  .stat-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
  }

  .stat-card .stat-icon {
    font-size: 26px;
    margin-bottom: 6px;
    display: inline-block;
  }

  .stat-card .stat-number {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .stat-card .stat-label {
    font-size: 13px;
    color: #6b7280;
    font-weight: 600;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .stat-card .stat-sub {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 8px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .stat-card .stat-sub .badge-open {
    color: #f59e0b;
    font-weight: 600;
  }
  .stat-card .stat-sub .badge-closed {
    color: #10b981;
    font-weight: 600;
  }
  .stat-card .stat-sub .badge-active {
    color: #3b82f6;
    font-weight: 600;
  }

  /* ألوان الكروت */
  .stat-card.blue { border-left-color: #3b82f6; }
  .stat-card.blue .stat-number { color: #3b82f6; }

  .stat-card.green { border-left-color: #10b981; }
  .stat-card.green .stat-number { color: #10b981; }

  .stat-card.purple { border-left-color: #8b5cf6; }
  .stat-card.purple .stat-number { color: #8b5cf6; }

  .stat-card.orange { border-left-color: #f59e0b; }
  .stat-card.orange .stat-number { color: #f59e0b; }

  .stat-card.red { border-left-color: #ef4444; }
  .stat-card.red .stat-number { color: #ef4444; }

  .stat-card.teal { border-left-color: #14b8a6; }
  .stat-card.teal .stat-number { color: #14b8a6; }

  .stat-card.pink { border-left-color: #ec4899; }
  .stat-card.pink .stat-number { color: #ec4899; }

  /* دائرة خلفية */
  .stat-card::after {
    content: '';
    position: absolute;
    top: -40px;
    right: -40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    opacity: 0.04;
    pointer-events: none;
  }
  .stat-card.blue::after { background: #3b82f6; }
  .stat-card.green::after { background: #10b981; }
  .stat-card.purple::after { background: #8b5cf6; }
  .stat-card.orange::after { background: #f59e0b; }
  .stat-card.red::after { background: #ef4444; }
  .stat-card.teal::after { background: #14b8a6; }
  .stat-card.pink::after { background: #ec4899; }

    overflow: hidden;
  }

    padding: 14px 20px;

    padding: 4px 12px;

    margin-bottom: 0;

    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

    padding: 12px 16px;
    border: none;
  }
  .table tbody td {
    padding: 12px 16px;
    vertical-align: middle;
    border-bottom: 1px solid #f1f5f9;
  }
  .table tbody tr:hover {
    background: #f8fafc;
  }
  .table tbody tr:last-child td {
    border-bottom: none;
  }

  /* ================= أزرار ================= */
  .btn-primary {

  .btn-success {

    border-radius: 10px;
    padding: 8px 20px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-success:hover {
    background: #059669;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }
  .btn-warning {
    background: #f59e0b;
    border: none;
    border-radius: 10px;
    padding: 8px 20px;
    font-weight: 500;
    color: #fff;

  .btn-warning:hover {
    background: #d97706;
    transform: translateY(-2px);

    color: #fff;
  }
  .btn-danger {
    background: #ef4444;
    border: none;
    border-radius: 10px;
    padding: 8px 20px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-danger:hover {
    background: #dc2626;

    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
  }
  .btn-info {
    background: #8b5cf6;

    border-radius: 10px;

    font-weight: 500;
    color: #fff;

  }
  .btn-info:hover {
    background: #7c3aed;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    color: #fff;
  }

  /* ================= Badges ================= */
  .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 500;
    font-size: 12px;
  }
  .badge.bg-success { background: #10b981 !important; }
  .badge.bg-warning { background: #f59e0b !important; color: #fff; }
  .badge.bg-danger { background: #ef4444 !important; }
  .badge.bg-info { background: #8b5cf6 !important; }
  .badge.bg-secondary { background: #94a3b8 !important; }

  /* ================= كروت التكاليف في Dashboard ================= */
  .cost-summary-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .cost-summary-card .label {
    font-size: 14px;
    color: #6b7280;
    font-weight: 500;
  }
  .cost-summary-card .amount {
    font-size: 22px;
    font-weight: 700;
  }
  .cost-summary-card .amount.green { color: #10b981; }
  .cost-summary-card .amount.red { color: #ef4444; }
  .cost-summary-card .amount.blue { color: #3b82f6; }
  .cost-summary-card .amount.purple { color: #8b5cf6; }

  /* ================= Responsive ================= */
  @media (max-width: 768px) {
    .sidebar {
      height: auto;
      padding: 15px;
    }
    .dashboard-stats-row {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .stat-card .stat-number {
      font-size: 24px;
    }
  }
  @media (max-width: 480px) {
    .dashboard-stats-row {
      grid-template-columns: 1fr;
    }
  }
