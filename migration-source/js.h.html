<script>
// ================= LOAD PAGE =================
function loadPage(page) {
  var content = document.getElementById("content");
  if (!content) return;
  
  if (page === "dashboard") renderDashboard();
  else if (page === "sites") renderSites();
  else if (page === "workorders") renderWorkOrders();
  else if (page === "reports") renderReports();
  else if (page === "gallery") renderGallery();
  else if (page === "devprojects") renderDevProjects();
  else content.innerHTML = "<h2>Page not found</h2>";
}

// ================= RENDER DASHBOARD =================

  google.script.run
    .withSuccessHandler(drawDashboard)
    .getDashboardData();
}

// ================= DRAW DASHBOARD =================

</div>

<!-- ================= SITE TASKS SUMMARY ================= -->
<div class="card shadow-sm mb-4">

<div class="row g-4 mb-4">

</div>

<div class="row mt-4"><div class="col-12"><div class="card shadow-sm"><div class="card-header bg-secondary text-white">🕒 Recent Activities</div><div class="card-body"><ul id="recentActivitiesList" class="mb-0"></ul></div></div></div></div>

  drawDashboardCharts(data);

    renderSiteTasks();

  if (data.topDevProjects) renderTopDevProjects(data.topDevProjects);
  if (data.topContractors) renderTopContractors(data.topContractors);
  if (data.topUsedParts) renderTopUsedParts(data.topUsedParts);
  if (data.recentActivities) renderRecentActivities(data.recentActivities);
  
  updateAlerts(data);
}

// ================= RENDER SITE TASKS =================
function renderSiteTasks() {
    var container = document.getElementById('siteTasksContainer');
    if (!container) {
        console.log("⚠️ siteTasksContainer not found!");
        return;
    }
    
    container.innerHTML = `
        <div class="text-center py-3">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">جاري تحميل مهام المواقع...</p>
        </div>
    `;
    
    google.script.run
        .withSuccessHandler(function(result) {
            console.log("📊 Site Tasks Result:", result);
            
            var summary = {};
            try {
                summary = typeof result === 'string' ? JSON.parse(result) : result;
            } catch(e) {
                console.error("Parse error:", e);
                summary = {};
            }
            
            var sites = Object.keys(summary);
            
            if (sites.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted py-4">
                        <p>📭 لا توجد مهام في المواقع</p>
                        <button class="btn btn-sm btn-primary" onclick="openSiteTaskModal()">
                            ➕ إضافة مهمة
                        </button>
                    </div>
                `;
                return;
            }
            
            var html = '';
            var grandTotal = 0;
            
            for (var i = 0; i < sites.length; i++) {
                var site = sites[i];
                var data = summary[site];
                var total = data.total || 0;
                var completed = data.completed || 0;
                var totalCost = data.totalCost || 0;
                grandTotal += totalCost;
                
                html += `
                    <div class="card mb-2 shadow-sm">
                        <div class="card-header bg-light d-flex justify-content-between align-items-center">
                            <strong>📍 ${site}</strong>
                            <div>
                                <span class="badge ${completed === total && total > 0 ? 'bg-success' : 'bg-warning'}">
                                    ${completed === total && total > 0 ? '✅ مكتمل' : '🔄 قيد التنفيذ'}
                                </span>
                                <span class="badge bg-info">💰 ${totalCost} SAR</span>
                                <span class="badge bg-secondary">${completed}/${total}</span>
                            </div>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-sm table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>المهمة</th>
                                            <th>التاريخ</th>
                                            <th>المبلغ</th>
                                            <th>الحالة</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                `;
                
                for (var j = 0; j < data.tasks.length; j++) {
                    var task = data.tasks[j];
                    var isClosed = task.status === 'Closed';
                    var startDate = task.startDate ? new Date(task.startDate).toLocaleDateString() : '-';
                    
                    html += `
                        <tr>
                            <td>${task.description || '-'}</td>
                            <td>${startDate}</td>
                            <td>${isClosed ? task.amount + ' SAR' : '-'}</td>
                            <td>
                                <span class="badge ${isClosed ? 'bg-success' : 'bg-warning'}">
                                    ${task.status || 'Open'}
                                </span>
                            </td>
                        </tr>
                    `;
                }
                
                html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            html += `
                <div class="card bg-success text-white">
                    <div class="card-body text-center">
                        <h5>💰 إجمالي تكاليف مهام المواقع</h5>
                        <h3>${grandTotal} SAR</h3>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
        })
        .withFailureHandler(function(err) {
            console.error("❌ Error:", err);
            container.innerHTML = `
                <div class="alert alert-danger text-center">
                    ❌ خطأ: ${err.message || 'غير معروف'}
                    <br>
                    <button class="btn btn-sm btn-primary mt-2" onclick="renderSiteTasks()">
                        🔄 إعادة المحاولة
                    </button>
                </div>
            `;
        })
        .getSiteTasksSummary();
}

// ================= REFRESH SITE TASKS =================
function refreshSiteTasks() {
    console.log("🔄 Refreshing site tasks...");
    renderSiteTasks();
}

// ================= SITES =================
function renderSites() {
  google.script.run
    .withSuccessHandler(function(data) {
      var rows = "";
      for (var i = 1; i < data.length; i++) {
        var row = data[i];
        rows += `
          <tr>
            <td>${row[0] || ""}</td>
            <td>${row[1] || ""}</td>
            <td>${row[2] || ""}</td>
            <td><span class="badge ${row[3] === 'Active' ? 'bg-success' : 'bg-secondary'}">${row[3] || ""}</span></td>
          </tr>
        `;
      }
      var html = `
        <h2>🏗️ Sites</h2>
        <div class="d-flex gap-2 mb-3">
          <button class="btn btn-warning" onclick="openSiteTaskModal()">🏗️ Site Tasks</button>
          <button class="btn btn-primary" onclick="openSiteModal()">+ Add Site</button>
        </div>
        <table class="table">
          <thead><tr><th>ID</th><th>Name</th><th>Region</th><th>Status</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="4">No sites</td></tr>'}</tbody>
        </table>
      `;
      document.getElementById("content").innerHTML = html;
    })
    .getSites();
}

// ================= WORK ORDERS =================
function renderWorkOrders() {
  document.getElementById("content").innerHTML = "Loading...";
  
  google.script.run
    .withSuccessHandler(function(data) {
      if (!data || data.length === 0) {
        document.getElementById("content").innerHTML = "No work orders found!";
        return;
      }
      
      var rows = "";
      for (var i = 0; i < data.length; i++) {
        var row = data[i];
        var status = row[3] || "Open";
        var isClosed = (status === "Closed");
        
        var imageData = row[5] || "";
        var imageHtml = "-";
        if (imageData) {
          if (!imageData.startsWith("data:image")) {
            imageData = "data:image/jpeg;base64," + imageData;
          }
          imageHtml = `<img src="${imageData}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;cursor:pointer;" onclick="viewFullImage('${imageData}')" title="🖱️ Click to enlarge">`;
        }
        
        rows += `
          <tr>
            <td>${row[0] || ""}</td>
            <td>${row[1] || ""}</td>
            <td>${row[2] || ""}</td>
            <td>${row[4] || ""}</td>
            <td><span class="badge ${isClosed ? 'bg-success' : 'bg-warning'}">${status}</span></td>
            <td>${imageHtml}</td>
            <td>
              ${isClosed ? "✅ Closed" : `<button class="btn btn-sm btn-danger" onclick="closeWO('${row[0]}')">🔒 Close</button>`}
              <button class="btn btn-sm btn-secondary" onclick="viewWorkOrderDetails('${row[0]}')">👁️ View</button>
            </td>
          </tr>
        `;
      }
      
      var html = `
        <h2>🔧 Work Orders</h2>
        <button class="btn btn-primary mb-3" onclick="openWOModal()">+ New WO</button>
        <table class="table">
          <thead><tr><th>WO No</th><th>Site</th><th>Category</th><th>Description</th><th>Status</th><th>Image</th><th>Action</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      document.getElementById("content").innerHTML = html;
    })
    .getWorkOrders();
}

// ================= VIEW FULL IMAGE =================
function viewFullImage(imageSrc) {
  var modal = document.createElement('div');
  modal.style.cssText = `
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    cursor: pointer;
  `;
  modal.onclick = function() { this.remove(); };
  var img = document.createElement('img');
  img.src = imageSrc;
  img.style.cssText = `
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    object-fit: contain;
  `;
  img.onclick = function(e) { e.stopPropagation(); };
  modal.appendChild(img);
  document.body.appendChild(modal);
}

// ================= VIEW WORK ORDER DETAILS =================
function viewWorkOrderDetails(woNo) {
  if (!woNo) {
    customAlert("❌ Invalid Work Order number", "خطأ");
    return;
  }
  
  google.script.run
    .withSuccessHandler(function(wo) {
      if (!wo) {
        customAlert("❌ Work Order not found", "خطأ");
        return;
      }
      
      var imageHtml = '';
      if (wo.image && wo.image.length > 50) {
        var imgSrc = wo.image;
        if (!imgSrc.startsWith('data:image')) {
          imgSrc = 'data:image/jpeg;base64,' + imgSrc;
        }
        imageHtml = `
          <div style="text-align:center;margin-top:10px;">
            <img src="${imgSrc}" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid #ddd;cursor:pointer;" onclick="viewFullImage('${imgSrc}')" title="🖱️ Click to view full size" />
          </div>
        `;
      } else {
        imageHtml = `<p style="color:#6c757d;text-align:center;">📷 No image attached</p>`;
      }
      
      var message = `
        <div style="text-align:left;font-size:14px;line-height:1.8;">
          <table style="width:100%;border-collapse:collapse;">
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;width:40%;">🔧 WO No:</td>
            <td style="padding:4px 8px;">${wo.woNo || '-'}</td></tr>
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">🏢 Site:</td>
            <td style="padding:4px 8px;">${wo.site || '-'}</td></tr>
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">📍 Area:</td>
            <td style="padding:4px 8px;">${wo.area || '-'}</td></tr>
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">📂 Category:</td>
            <td style="padding:4px 8px;">${wo.category || '-'}</td></tr>
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">📝 Description:</td>
            <td style="padding:4px 8px;">${wo.description || '-'}</td></tr>
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">⚡ Priority:</td>
            <td style="padding:4px 8px;"><span class="badge ${wo.priority === 'High' ? 'bg-danger' : wo.priority === 'Medium' ? 'bg-warning' : 'bg-info'}">${wo.priority || 'Normal'}</span></td></tr>
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">📊 Status:</td>
            <td style="padding:4px 8px;"><span class="badge ${wo.status === 'Closed' ? 'bg-success' : 'bg-warning'}">${wo.status || 'Open'}</span></td></tr>
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">👤 Assigned To:</td>
            <td style="padding:4px 8px;">${wo.assignedTo || 'N/A'}</td></tr>
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">🔨 Contractor:</td>
            <td style="padding:4px 8px;">${wo.contractor || 'N/A'}</td></tr>
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">💰 Final Cost:</td>
            <td style="padding:4px 8px;font-weight:bold;color:#198754;">${(wo.cost || 0).toLocaleString()} SAR</td></tr>
            <tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">💰 Contractor Cost:</td>
            <td style="padding:4px 8px;font-weight:bold;color:#dc3545;">${(wo.contractorCost || 0).toLocaleString()} SAR</td></tr>
            ${wo.partsUsed ? `<tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">📦 Parts Used:</td><td style="padding:4px 8px;">${wo.partsUsed}</td></tr>` : ''}
            ${wo.closingNotes ? `<tr><td style="padding:4px 8px;font-weight:bold;color:#0d6efd;">📝 Closing Notes:</td><td style="padding:4px 8px;font-style:italic;">${wo.closingNotes}</td></tr>` : ''}
          </table>
          ${imageHtml}
        </div>
      `;
      
      customAlert(message, `📋 Work Order: ${wo.woNo}`);
    })
    .withFailureHandler(function(err) {
      customAlert("❌ Error loading work order details: " + err.message, "خطأ");
    })
    .getWorkOrderDetails(woNo);
}

// ================= REPORTS =================
function renderReports() {
  var html = `
    <h2>📈 Reports</h2>
    <div class="row gap-2">
      <button class="btn btn-primary col-md-2" onclick="generateReport('month')">📅 Monthly</button>
      <button class="btn btn-success col-md-2" onclick="generateReport('3months')">📅 3 Months</button>
      <button class="btn btn-warning col-md-2" onclick="generateReport('6months')">📅 6 Months</button>
      <button class="btn btn-dark col-md-2" onclick="generateReport('year')">📅 Yearly</button>
    </div>
    <div id="reportResult" class="mt-4"></div>
  `;
  document.getElementById("content").innerHTML = html;
}

function generateReport(period) {
  document.getElementById("reportResult").innerHTML = "⏳ Generating...";
  google.script.run
    .withSuccessHandler(function(data) {
      var html = `
        <div class="card p-3">
          <h4>📊 ${period} Report</h4>
          <p><strong>Work Orders:</strong> ${data.woCount || 0}</p>
          <p><strong>WO Total Cost:</strong> ${data.woTotalCost || 0}</p>
          <p><strong>Projects:</strong> ${data.projCount || 0}</p>
          <p><strong>Projects Total Cost:</strong> ${data.projTotalCost || 0}</p>
        </div>
      `;
      document.getElementById("reportResult").innerHTML = html;
    })
    .getPeriodicReport(period);
}

// ================= GALLERY =================
function renderGallery() {
  document.getElementById("content").innerHTML = `
    <h2>🖼️ Gallery</h2>
    <p class="text-muted">Click on any image to view full size</p>
    <div id="galleryContainer">
      <div class="text-center"><div class="spinner-border"></div><p>Loading images...</p></div>
    </div>
  `;
  
  google.script.run
    .withSuccessHandler(function(data) {
      var container = document.getElementById("galleryContainer");
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-muted text-center">📭 No images found</p>';
        return;
      }
      
      var html = '<div class="row g-3">';
      var count = 0;
      
      for (var i = 0; i < data.length; i++) {
        var item = data[i];
        var imageData = item.image || '';
        var source = item.source || '';
        var reference = item.reference || '';
        var site = item.site || '';
        
        if (imageData && imageData.length > 50) {
          if (!imageData.startsWith("data:image")) {
            imageData = "data:image/jpeg;base64," + imageData;
          }
          count++;
          
          var badgeColor = '';
          if (source === 'Work Order') badgeColor = 'bg-danger';
          else if (source === 'Development Project') badgeColor = 'bg-success';
          else if (source === 'Site Task') badgeColor = 'bg-info';
          else badgeColor = 'bg-secondary';
          
          html += `
            <div class="col-md-3 col-sm-4 col-6">
              <div class="card gallery-card shadow-sm h-100">
                <img src="${imageData}" 
                     class="card-img-top gallery-img" 
                     style="height:200px;object-fit:cover;cursor:pointer;border-radius:8px 8px 0 0;"
                     onclick="viewFullImage('${imageData}')"
                     loading="lazy"
                     alt="${reference}">
                <div class="card-body text-center p-2">
                  <small class="text-muted">📋 ${reference}</small>
                  ${site ? `<br><small class="text-muted">📍 ${site}</small>` : ''}
                  <br><span class="badge ${badgeColor}" style="font-size:10px;">${source}</span>
                </div>
              </div>
            </div>
          `;
        }
      }
      
      html += '</div>';
      if (count === 0) {
        html = '<p class="text-muted text-center">📭 No images found</p>';
      }
      
      container.innerHTML = html;
    })
    .withFailureHandler(function(err) {
      document.getElementById("galleryContainer").innerHTML = '<div class="alert alert-danger">❌ Error: ' + err.message + '</div>';
    })
    .getGalleryImages();
}

// ================= CLEAR MODAL =================
function clearModal(modalId){
  const modal = document.getElementById(modalId);
  if(!modal) return;
  modal.querySelectorAll("input, textarea, select").forEach(function(el){
    switch(el.type){
      case "checkbox":
      case "radio":
        el.checked = false;
        break;
      case "file":
        el.value = "";
        break;
      default:
        el.value = "";
    }
  });
}

function renderDevProjects() {
  document.getElementById("content").innerHTML = "Loading...";

  google.script.run
    .withSuccessHandler(function(data) {
      var rows = "";
      if (!data || data.length === 0) {
        rows = '<tr><td colspan="9" class="text-center text-muted">No Data</td></tr>';
      } else {
        for (var i = 0; i < data.length; i++) {
          var project = data[i];
          var id = project.id || "";
          var name = project.name || "";
          var description = project.description || "";
          var status = project.status || "Active";
          var totalCost = project.totalCost || 0;
          var tasksCost = project.tasksCost || 0;
          var partsCost = project.partsCost || 0;
          var contractor = project.contractor || "";
          var isCompleted = (status === "Completed");

          rows += `
            <tr>
              <td><strong>${id}</strong></td>
              <td>${name}</td>
              <td>${description ? description.substring(0, 30) + '...' : '-'}</td>
              <td>${contractor || '-'}</td>
              <td><span class="badge ${isCompleted ? 'bg-success' : 'bg-warning'}">${status}</span></td>
              <td>${Number(tasksCost).toLocaleString()} SAR</td>
              <td>${Number(partsCost).toLocaleString()} SAR</td>
              <td><strong>${Number(totalCost).toLocaleString()} SAR</strong></td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="openDevTaskModal('${id}')">🛠️ Tasks</button>
                <button class="btn btn-sm btn-success" onclick="openDevPartsModal('${id}')">📦 Parts</button>
                ${isCompleted ? "✅ Closed" : `<button class="btn btn-sm btn-danger" onclick="closeDevProject('${id}')">🔒 Close</button>`}
              </td>
            </tr>
          `;
        }
      }

      var html = `
        <h2>🏗️ Development Projects</h2>
        <div class="d-flex justify-content-between mb-3">
          <p class="text-muted">Manage development projects (new doors, AC, electrical, etc.)</p>
          <button class="btn btn-primary" onclick="openDevProjectModal()">+ New Project</button>
        </div>

        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Project</th>
              <th>Description</th>
              <th>Contractor</th>
              <th>Status</th>
              <th>Tasks Cost</th>
              <th>Parts Cost</th>
              <th>Total Cost</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      document.getElementById("content").innerHTML = html;
    })
    .withFailureHandler(function(err) {
      document.getElementById("content").innerHTML =
        '<div class="alert alert-danger">❌ ' + (err.message || JSON.stringify(err)) + '</div>';
    })
    .getDevProjects();
}

function saveSiteTask() {
    var site = document.getElementById('siteTaskSite').value;
    var description = document.getElementById('siteTaskDesc').value.trim();
    var startDate = document.getElementById('siteTaskStartDate').value;
    var assignedTo = document.getElementById('siteTaskAssigned').value.trim();
    var image = document.getElementById('siteTaskImage')?.value || '';
    var notes = document.getElementById('siteTaskMessage')?.value || '';
    
    if (!site) {
        document.getElementById('siteTaskMessage').innerHTML = 
            '<div class="alert alert-warning">⚠️ Please select a Site</div>';
        return;
    }
    if (!description) {
        document.getElementById('siteTaskMessage').innerHTML = 
            '<div class="alert alert-warning">⚠️ Please enter Task Description</div>';
        return;
    }
    
    var saveBtn = document.querySelector('#siteTaskModal .btn-success');
    saveBtn.disabled = true;
    saveBtn.textContent = '⏳ Adding...';
    document.getElementById('siteTaskMessage').innerHTML = '';
    
    var data = {
        site: site,
        description: description,
        startDate: startDate,
        assignedTo: assignedTo,

        notes: notes

    google.script.run
        .withSuccessHandler(function(response) {

    if (!confirm("Are you sure you want to close this task?")) return;
    
    var amount = prompt("💰 Enter total cost for this task (SAR):");
    if (amount === null) return;
    if (isNaN(amount) || amount <= 0) {
        alert("⚠️ Please enter a valid amount");

    var contractorCost = prompt("💰 Enter contractor cost (SAR):");

        alert("⚠️ Please enter a valid contractor cost");
        return;
    }
    
    google.script.run
        .withSuccessHandler(function(msg) {
            alert(msg);
            if (document.getElementById('siteTasksContainer')) {
                renderSiteTasks();
            }
        })
        .withFailureHandler(function(err) {
            alert("❌ Error: " + err.message);
        })
        .closeSiteTask(taskId, { 
            amount: amount,
            contractorCost: contractorCost,
            closeDate: new Date().toISOString().split('T')[0]
        });
